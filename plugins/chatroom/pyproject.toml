# The chat room's one environment (Python 3.14). chat.py relaunches itself here through `uv run` when it is started
# by an older Python; the environment lives in UV_PROJECT_ENVIRONMENT (default ~/.claude/chatroom/env).
[project]
name = "chatroom"
version = "0.14.2"
requires-python = ">=3.14"
dependencies = [
    "headroom-ai>=0.41.0",               # only compress() is used: [proxy] and [code] add 380 MB (transformers, onnxruntime, tree-sitter packs)
    "openai>=2.54.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "tiktoken>=0.14.0",
    "loguru>=0.7.3",
    "jsonschema>=4.26.0",
    "yt-dlp>=2026.8.19",
]

[tool.uv]
package = false
