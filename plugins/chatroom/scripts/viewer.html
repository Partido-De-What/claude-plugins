<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat room</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --accent: #00a884;
    --bg: #efeae2; --pattern: rgba(0,0,0,.045); --header: #f0f2f5; --header-text: #111b21; --muted: #667781;
    --in: #ffffff; --out: #d9fdd3; --text: #111b21; --pill: #ffffffe6; --pill-text: #54656f; --border: #d1d7db;
    --link: #027eb5; --flash: #fff3b0; --input: #ffffff; --panel: #ffffff; --shadow: rgba(11,20,26,.13);
    --plan: #fff8e1; --plan-dark: #f5b400;
  }
  :root[data-theme="dark"] {
    --bg: #0b141a; --pattern: rgba(255,255,255,.03); --header: #202c33; --header-text: #e9edef; --muted: #8696a0;
    --in: #202c33; --out: #005c4b; --text: #e9edef; --pill: #182229ee; --pill-text: #8696a0; --border: #2a3942;
    --link: #53bdeb; --flash: #3b3a1a; --input: #2a3942; --panel: #111b21; --shadow: rgba(0,0,0,.35);
    --plan: #2b2a1c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14.2px/1.42 "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; color: var(--text);
         background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; }

  /* header */
  header { background: var(--header); color: var(--header-text); padding: 9px 14px; display: flex; gap: 12px;
           align-items: center; border-bottom: 1px solid var(--border); position: relative; z-index: 2; }
  .group-icon { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); display: grid;
                place-items: center; font-size: 22px; flex: none; color: #fff; }
  .head-text { min-width: 0; flex: 1; }
  .title { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live .who { font-weight: 600; }
  .live.active { color: var(--accent); }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; cursor: pointer;
              font-size: 17px; display: grid; place-items: center; color: var(--muted); flex: none; }
  .icon-btn:hover { background: rgba(127,127,127,.15); }
  .icon-btn.on { color: var(--accent); }
  #search { display: none; border: 0; border-radius: 8px; padding: 7px 10px; background: var(--input); color: var(--text);
            font: inherit; width: 200px; outline: none; }
  #search.open { display: block; }

  /* members strip */
  .strip { background: var(--header); border-bottom: 1px solid var(--border); padding: 6px 14px; display: flex;
           gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 3px; border-radius: 16px;
          background: rgba(127,127,127,.1); white-space: nowrap; }
  .chip .av { width: 22px; height: 22px; font-size: 12px; }
  .chip b { font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #aebac1; }
  .dot.on { background: #25d366; } .dot.late { background: #f5a623; }
  .dot.idle { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
  .chip.idle { opacity: .72; }
  .strip .count { margin-left: auto; }

  /* feed */
  #feed { flex: 1; overflow-y: auto; padding: 12px 5% 18px; }
  body[data-wall="dots"] #feed { background-image: radial-gradient(var(--pattern) 1.3px, transparent 1.3px); background-size: 18px 18px; }
  body[data-wall="grid"] #feed { background-image: linear-gradient(var(--pattern) 1px, transparent 1px), linear-gradient(90deg, var(--pattern) 1px, transparent 1px); background-size: 24px 24px; }
  .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; color: #fff;
        font-weight: 600; flex: none; box-shadow: 0 1px 2px var(--shadow); }
  .row { display: flex; gap: 8px; margin: 2px 0; align-items: flex-start; }
  .row .av { visibility: hidden; }
  .row.first { margin-top: 12px; }
  .row.first .av { visibility: visible; }
  .row.out { justify-content: flex-end; }
  .row.out .av { display: none; }
  .bubble { max-width: min(700px, 86%); background: var(--in); border-radius: 9px; padding: 6px 10px 18px;
            position: relative; box-shadow: 0 1px .5px var(--shadow); overflow-wrap: anywhere; min-width: 110px; }
  .row.out .bubble { background: var(--out); }
  .row.first:not(.out) .bubble { border-top-left-radius: 2px; }
  .row.out.first .bubble { border-top-right-radius: 2px; }
  .bubble.plan { background: var(--plan); border-left: 4px solid var(--plan-dark); }
  .who-line { display: flex; gap: 6px; align-items: baseline; margin-bottom: 2px; }
  .name { font-weight: 600; font-size: 12.8px; }
  .role { color: var(--muted); font-size: 11.5px; }
  .meta { position: absolute; right: 9px; bottom: 3px; font-size: 11px; color: var(--muted); }
  .num { color: var(--muted); font-size: 11px; margin-right: 6px; }
  .flash { animation: flash 1.6s ease; }
  @keyframes flash { 0%, 40% { background: var(--flash); } }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px;
           margin: 0 0 5px; color: #fff; background: var(--plan-dark); }
  .badge.yes { background: #25a55f; } .badge.no { background: #d64545; }
  .pill { margin: 7px auto; width: fit-content; max-width: 84%; background: var(--pill); color: var(--pill-text);
          font-size: 12.5px; padding: 5px 12px; border-radius: 8px; box-shadow: 0 1px .5px var(--shadow); text-align: center; }
  .pill b { font-weight: 600; }
  .pill.common { border: 1px dashed var(--accent); background: transparent; box-shadow: none; }
  .scope { display: flex; gap: 6px; padding: 6px 12px; background: var(--panel, transparent); border-bottom: 1px solid #0001; flex-wrap: wrap; }
  .scope button { border: 1px solid #8884; background: transparent; color: inherit; border-radius: 14px; padding: 3px 11px; cursor: pointer; font: inherit; font-size: 12.5px; }
  .scope button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .roomtag { font-size: 11px; opacity: .75; margin-left: 6px; }
  .pill.closed { background: #25a55f; color: #fff; font-weight: 600; font-size: 13.5px; padding: 8px 16px; }
  .pill.idle { opacity: .85; font-style: italic; background: transparent; box-shadow: none;
               border: 1px dashed var(--border); }
  .pill.idle .tag { font-style: normal; font-weight: 600; }
  .hidden { display: none !important; }
  code { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; background: rgba(127,127,127,.16);
         padding: 0 3px; border-radius: 3px; }
  mark { background: #ffe066; color: #111; border-radius: 2px; }
  .mention { font-weight: 600; }
  a.mention { text-decoration: none; cursor: pointer; }
  a.ref { color: var(--link); text-decoration: none; cursor: pointer; }
  a.ref:hover, a.mention:hover { text-decoration: underline; }
  table { border-collapse: collapse; margin: 5px 0; font-size: 12.5px; display: block; overflow-x: auto; }
  td, th { border: 1px solid var(--border); padding: 3px 7px; text-align: left; vertical-align: top; }
  th { font-weight: 600; background: rgba(127,127,127,.08); }
  #newer { position: fixed; right: 26px; bottom: 90px; background: var(--accent); color: #fff; border: 0; border-radius: 18px;
           padding: 8px 14px; font-weight: 600; cursor: pointer; display: none; box-shadow: 0 2px 6px rgba(0,0,0,.25); z-index: 3; }
  #empty { text-align: center; color: var(--muted); margin-top: 60px; }
  .pics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .pics img { max-width: 100%; max-height: 320px; border-radius: 6px; display: block; cursor: zoom-in;
              box-shadow: 0 1px 2px var(--shadow); background: rgba(127,127,127,.12); }
  .pics.many img { max-height: 200px; max-width: calc(50% - 3px); object-fit: cover; }
  .pill .pics { justify-content: center; } .pill .pics img { max-height: 160px; }
  /* a structured status (JSON): a card with the task, a progress bar and the fields that were given */
  .card { margin: 8px auto; width: min(560px, 92%); background: var(--in); color: var(--text); border-radius: 10px; padding: 9px 12px 8px;
          box-shadow: 0 1px .5px rgba(11,20,26,.13); border-left: 4px solid var(--who, var(--accent)); font-size: 13.5px; }
  .card .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card .task { background: var(--accent); color: #fff; border-radius: 6px; padding: 1px 7px; font-weight: 700; font-size: 12px; }
  .card .step { flex: 1; min-width: 40%; }
  .card .bar { height: 6px; border-radius: 3px; background: var(--border); margin: 7px 0 5px; overflow: hidden; }
  .card .bar i { display: block; height: 100%; background: var(--who, var(--accent)); }
  .card .f { display: grid; grid-template-columns: 22px 1fr; gap: 2px 4px; margin-top: 3px; }
  .card .f span:first-child { text-align: center; }
  .card ul { margin: 0; padding-left: 16px; }
  .card .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .card .chips code { background: var(--border); border-radius: 5px; padding: 0 5px; font-size: 11.5px; }
  .pill.board { font-size: 12.5px; }
  .pill.finding { background: #fff3c4; color: #5d4500; font-size: 13px; }
  .pill.choice { font-size: 13.5px; padding: 9px 14px; }
  .pill.choice .choices { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 7px; }
  .pill.choice button { border: 1px solid var(--accent); background: transparent; color: inherit; border-radius: 16px; padding: 5px 14px;
                        cursor: pointer; font: inherit; }
  .pill.choice button:hover:not(:disabled) { background: var(--accent); color: #fff; }
  .pill.choice button:disabled { cursor: default; opacity: .45; }
  .pill.choice button.on { opacity: 1; background: var(--accent); color: #fff; }
  .quote { border-left: 3px solid var(--accent); background: rgba(0,0,0,.05); border-radius: 6px; padding: 3px 8px; margin: 2px 0 5px;
           font-size: 12.5px; color: var(--muted); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.86); display: none; place-items: center; z-index: 20;
              cursor: zoom-out; padding: 18px; }
  #lightbox.open { display: grid; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,.5); }
  #attach, #cmdBtn { background: transparent; border: 0; font-size: 20px; cursor: pointer; padding: 0 6px; color: var(--muted); height: 42px; }
  #pending { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 8px; }
  #pending:empty { display: none; }
  #pending .chip { position: relative; }
  #pending img { height: 54px; border-radius: 5px; display: block; }
  #pending button { position: absolute; top: -6px; right: -6px; border: 0; border-radius: 50%; width: 18px; height: 18px;
                    font-size: 11px; line-height: 18px; padding: 0; cursor: pointer; background: #d64545; color: #fff; }

  /* composer */
  footer { background: var(--header); padding: 8px 12px 4px; border-top: 1px solid var(--border); }
  .compose { display: flex; gap: 8px; align-items: flex-end; }
  #box { flex: 1; resize: none; border: 0; border-radius: 9px; padding: 10px 12px; background: var(--input);
         color: var(--text); font: inherit; max-height: 150px; min-height: 42px; outline: none; }
  #send { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: #fff;
          font-size: 18px; cursor: pointer; flex: none; }
  #send:disabled { opacity: .5; cursor: default; }
  #hint { color: var(--muted); font-size: 11.5px; padding: 4px 4px 2px; }
  footer { position: relative; }
  #cmdBtn, #attach { flex: none; }
  /* the @ and / menu above the box */
  #suggest { position: absolute; bottom: 100%; left: 12px; right: 12px; max-height: 280px; overflow-y: auto; display: none;
             background: var(--panel); border: 1px solid var(--border); border-radius: 10px; z-index: 6;
             box-shadow: 0 -4px 16px rgba(0,0,0,.2); padding: 4px 0; }
  #suggest.open { display: block; }
  #suggest .head { color: var(--muted); font-size: 11.5px; padding: 4px 12px 2px; }
  .sug { display: flex; gap: 10px; align-items: center; padding: 7px 12px; cursor: pointer; }
  .sug.on, .sug:hover { background: rgba(127,127,127,.16); }
  .sug .av { width: 26px; height: 26px; font-size: 13px; }
  .sug .ic { width: 26px; text-align: center; font-size: 17px; flex: none; }
  .sug .main { font-weight: 600; }
  .sug .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sug .txt { min-width: 0; display: flex; flex-direction: column; }

  /* settings panel */
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 9; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--panel); z-index: 10;
           transform: translateX(100%); transition: transform .2s ease; display: flex; flex-direction: column;
           box-shadow: -4px 0 16px rgba(0,0,0,.25); }
  #panel.open { transform: none; }
  #panel.open + #scrim, body.panel-open #scrim { display: block; }
  .panel-head { background: var(--accent); color: #fff; padding: 16px 18px; font-weight: 600; font-size: 16px;
                display: flex; align-items: center; gap: 10px; }
  .panel-head button { margin-left: auto; background: transparent; border: 0; color: #fff; font-size: 20px; cursor: pointer; }
  .panel-body { padding: 14px 18px; overflow-y: auto; flex: 1; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; font-size: 12.5px; color: var(--muted); }
  .field input[type=text], .field select { border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px;
           background: var(--input); color: var(--text); font: inherit; font-size: 14px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .section { font-weight: 600; color: var(--text); margin: 16px 0 8px; font-size: 13px; }
  .person { display: grid; grid-template-columns: 34px 1fr 44px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .person input[type=text] { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; background: var(--input);
                              color: var(--text); font: inherit; font-size: 13px; min-width: 0; }
  .person .emoji { text-align: center; padding: 6px 2px; }
  .person .pname { grid-column: 1 / -1; font-weight: 600; font-size: 12.5px; margin-bottom: -4px; }
  input[type=color] { width: 44px; height: 32px; border: 1px solid var(--border); border-radius: 6px; background: none; padding: 2px; }
  .panel-foot { padding: 12px 18px; display: flex; gap: 10px; border-top: 1px solid var(--border); }
  .btn { flex: 1; border: 0; border-radius: 20px; padding: 10px; cursor: pointer; font-weight: 600; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: rgba(127,127,127,.15); }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text); margin: 6px 0; cursor: pointer; }
  #saved { color: var(--accent); font-size: 12.5px; min-height: 16px; }
  @media (max-width: 640px) { .live { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2;
                                      -webkit-box-orient: vertical; }
                                #feed { padding: 10px 8px 18px; } .bubble { max-width: 92%; } #search.open { width: 120px; } }

  /* the Research tab of a research room: phases, chart, runs, ideas, verdicts (research.json) */
  #research { flex: 1; overflow-y: auto; padding: 12px 5% 18px; display: none; }
  body.rs-open #research { display: block; }
  body.rs-open #feed, body.rs-open #newer { display: none; }
  .rs { --ok: #43a047; --no: #90a4ae; --bad: #e53935; --run: #4dd0e1; --warn: #ffb74d; max-width: 1100px; margin: 0 auto; }
  .rs h2 { font-size: 15px; margin: 0 0 6px; font-weight: 700; }
  .rs h3 { font-size: 12.5px; margin: 0 0 6px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .rs-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
  .rs-head small { color: var(--muted); }
  .rs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 10px; margin-top: 10px; }
  .rs-card { background: var(--in); border-radius: 10px; padding: 10px 12px; box-shadow: 0 1px .5px var(--shadow); min-width: 0; overflow-wrap: anywhere; }
  .rs-wide { grid-column: 1 / -1; }
  .rs-pipe { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0; align-items: center; }
  .rs-pipe li { border-radius: 14px; padding: 3px 11px; font-size: 12.5px; background: rgba(127,127,127,.14); color: var(--muted); }
  .rs-pipe li.done { background: var(--ok); color: #fff; }
  .rs-pipe li.cur { background: var(--run); color: #08323a; font-weight: 700; animation: rs-pulse 2.4s ease-in-out infinite; }
  .rs-pipe li.gate { padding: 3px 6px; background: var(--bad); color: #fff; font-weight: 700; }
  .rs-pipe li.gate.open { background: var(--ok); }
  .rs-why { font-size: 12.5px; margin-top: 6px; color: var(--muted); }
  .rs-why.shut { color: var(--bad); }
  @keyframes rs-pulse { 50% { box-shadow: 0 0 0 4px rgba(77,208,225,.35); } }
  @media (prefers-reduced-motion: reduce) { .rs-pipe li.cur, .rs-ring, .rs-lamp.run { animation: none !important; } }
  .rs-chart { width: 100%; height: auto; display: block; touch-action: manipulation; }
  .rs-chart text { fill: var(--muted); font-size: 12px; }
  .rs-chart .grid { stroke: var(--border); stroke-width: 1; }
  .rs-chart .pt { cursor: pointer; }
  .rs-ring { fill: none; stroke: var(--run); stroke-width: 2; animation: rs-pulse-svg 2s ease-in-out infinite; }
  @keyframes rs-pulse-svg { 50% { stroke-opacity: .25; } }
  .rs-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .rs-legend b { display: inline-block; width: 16px; height: 3px; margin-right: 4px; vertical-align: 3px; border-radius: 2px; }
  .rs-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  .rs-detail { min-height: 20px; font-size: 13px; margin-top: 6px; }
  .rs-tablewrap { overflow-x: auto; }
  .rs-table { display: table; width: 100%; font-size: 12.5px; margin: 0; }
  .rs-table td, .rs-table th { padding: 3px 6px; }
  .rs-table tr.rev td { text-decoration: line-through; opacity: .55; }
  .rs-chip { display: inline-block; border-radius: 9px; padding: 0 8px; font-size: 11.5px; font-weight: 700; color: #fff; background: var(--no); }
  .rs-chip.keep, .rs-chip.pass, .rs-chip.answer_ready { background: var(--ok); }
  .rs-chip.crash, .rs-chip.fail { background: var(--bad); }
  .rs-chip.search_more, .rs-chip.warn { background: var(--warn); color: #3b2a00; }
  .rs-chip.run { background: var(--run); color: #08323a; }
  .rs-row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; padding: 3px 0; font-size: 13px; }
  .rs-row small { color: var(--muted); }
  .rs-bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; width: 100%; margin: 4px 0; }
  .rs-bar i { display: block; height: 100%; background: var(--run); transition: width .9s linear; }
  .rs-idea { border-left: 3px solid var(--no); padding: 2px 8px; margin: 4px 0; font-size: 13px; }
  .rs-idea.tried { border-color: var(--run); } .rs-idea.accepted { border-color: var(--warn); }
  .rs-idea.trash { opacity: .6; text-decoration: line-through; border-color: var(--bad); }
  .rs-chain, .rs-chain ul { list-style: none; margin: 0; padding-left: 14px; border-left: 2px solid var(--bad); font-size: 13px; }
  .rs-chain { padding-left: 0; border: 0; }
  .rs-seals { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0; }
  .rs-seals i { width: 12px; height: 12px; border-radius: 3px; background: var(--no); display: block; }
  .rs-seals i.on { background: var(--ok); }
  .rs-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .rs-chips code { font-size: 11.5px; }
  .rs-lamp { width: 12px; height: 12px; border-radius: 50%; background: var(--no); display: inline-block; vertical-align: -1px; margin-right: 6px; }
  .rs-lamp.warn { background: var(--warn); } .rs-lamp.run { background: var(--run); animation: rs-pulse 2s ease-in-out infinite; }
  .rs-log { font-size: 12px; color: var(--muted); max-height: 190px; overflow-y: auto; }
  .rs-log b { color: var(--text); } .rs-log .bad { color: var(--bad); }
</style>
<script type="importmap">{"imports": {"three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/"}}</script>
</head>
<body data-wall="dots">
<div id="office"></div>
<header>
  <div class="group-icon" id="gicon">💬</div>
  <div class="head-text">
    <div class="title" id="title">Chat room</div>
    <div class="live" id="live"></div>
  </div>
  <input id="search" type="text" autocomplete="off">
  <button class="icon-btn" id="researchBtn" title="" hidden>🔬</button>
  <button class="icon-btn" id="officeBtn" title="Ufficio 3D / 3D office" onclick="window.officeMode && window.officeMode()">🏢</button>
  <button class="icon-btn" id="searchBtn" title="">🔍</button>

<script src="i18n.js"></script>
<script>
// the texts are in locales/<lang>.json (viewer.*): the functions' fields in call order, and the one that holds logic
const VIEW_ARGS = {newer: ['n'], placeholder: ['u'], idleSince: ['time', 'n'], messages: ['n'], members: ['n']};
const VIEW_EXTRA = tx => ({ago: s => s < 60 ? tx('ago_s', {s: Math.round(s)}) : tx('ago_min', {m: Math.round(s / 60)})});
const PALETTE = ['#1fa855', '#027eb5', '#d9730d', '#8e44ad', '#c0392b', '#16a085', '#b7950b', '#6c5ce7', '#e84393', '#0984e3'];
const $ = id => document.getElementById(id);
const feed = $('feed');
let config = {heartbeat: 120, user_name: 'USER', self_names: [], participants: [], profiles: {}, lang: 'en'};
// visiting a friend who shares the room chat: the chat shown and written here is the friend's room chat
const FRIEND = new URLSearchParams(location.search).has('visit')
  ? fetch('friendroom/config.json', {cache: 'no-store'}).then(r => r.ok ? 'friendroom/' : '').catch(() => '') : Promise.resolve('');
let SELF = new Set(['USER']), USERS = new Set(['USER']), shown = 0, lastFrom = null, all = [], unseen = 0, sound = false, query = '';
const t = () => I18N.table('viewer', VIEW_ARGS, VIEW_EXTRA, config.lang);

function pref(key, fallback) { try { const v = localStorage.getItem('chatroom.' + key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } }
function setPref(key, value) { try { localStorage.setItem('chatroom.' + key, JSON.stringify(value)); } catch (e) {} }

function profile(name, cfg = config) {
  const p = (cfg.profiles || {})[name] || {};
  const i = (config.participants || []).indexOf(name);
  let color = p.color;
  if (!color) {
    if (USERS.has(name)) color = '#c0392b';
    else if (SELF.has(name)) color = '#5c6bc0';                                      // the lead: its own colour, not the user's
    else if (i >= 0) color = PALETTE[i % PALETTE.length];
    else { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; color = PALETTE[h % PALETTE.length]; }
  }
  return {color, emoji: p.emoji || (USERS.has(name) ? '👤' : SELF.has(name) ? '👓' : name.slice(0, 1)),
          role: p.role || (SELF.has(name) && !USERS.has(name) ? 'LEAD' : '')};
}
function avatar(name, cls = '') {
  const p = profile(name);
  return `<div class="av ${cls}" style="background:${p.color}" title="${esc(name)}">${esc(p.emoji)}</div>`;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
const EVERYONE = ['all', 'tutti', 'everyone'];
// the participant a tag points to, in any case (@nativo is NATIVO); null when nobody has that name
function canon(n) {
  const low = n.toLowerCase();
  const names = [...(config.participants || []), ...Object.keys(config.profiles || {}), ...all.map(m => m.from)];
  return names.find(x => x.toLowerCase() === low) || null;
}
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/(^|[^\w@])@([A-Za-z][\w-]*)/g, (m, pre, n) => {
    if (EVERYONE.includes(n.toLowerCase())) return `${pre}<span class="mention">@${n}</span>`;
    const who = canon(n);
    if (!who) return m;
    return `${pre}<a class="mention" data-who="${esc(who)}" style="color:${profile(who).color}">@${n}</a>`;
  });
  s = s.replace(/(^|[^\w&])#(\d{1,4})\b/g, (m, pre, n) => `${pre}<a class="ref" data-ref="${n}">#${n}</a>`);
  return s;
}
function render(text) {
  const lines = text.split('\n'), out = [];
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].trim().startsWith('|')) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith('|')) { rows.push(lines[i].trim()); i++; }
      i--;
      const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const body = rows.filter(r => !cells(r).every(c => /^:?-{2,}:?$/.test(c)));
      out.push('<table>' + body.map((r, k) => '<tr>' + cells(r).map(c => k === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</table>');
    } else {
      out.push(inline(lines[i]) + '<br>');
    }
  }
  return out.join('').replace(/(<br>)+$/, '');
}
const isStatus = m => m.kind === 'status' || m.kind === 'stato';
const isIdle = m => m.kind === 'idle';
// the idle status of a participant whose latest message is one (posting anything else ends the idle)
function idleOf(name) {
  for (let i = all.length - 1; i >= 0; i--) if (all[i].from === name) return isIdle(all[i]) ? all[i] : null;
  return null;
}
// the same reading as chat.py heads(): at the start of a line, after a reply mark, tags or markdown
const LINE_HEAD = /^(?:\s*↪\s*#\d+|\s*@[\w-]+[\s,:]*|\s*\d{1,3}[.)]\s+|[^\p{L}\p{N}_@↪]+|_+)+/u;
const QUOTED = /^\s*(?:↪\s*#\d+\s*)?(?:@[\w-]+[\s,:]*)*[>"“”«‘’'`(]/u;   // somebody else's words: not read
const heads = t => String(t || '').split('\n').filter(l => l.trim() && !QUOTED.test(l)).map(l => l.replace(LINE_HEAD, '')).filter(h => h.trim());
const firstHead = t => heads(t)[0] || '';
const HEAD_END = String.raw`[*_]*(?!\s*[\p{L}])`;   // a heading: "PLAN v2: ...", "PLAN v1 (draft)", not "PLAN v2 also needs a test"
const isClosed = text => new RegExp(String.raw`^(CLOSED|CHIUSO)(?:\s*[vV]\d+)?` + HEAD_END, 'u').test(firstHead(text));
function badge(text) {
  const plan = firstHead(text).match(new RegExp(String.raw`^(PLAN|PIANO)\s*v\d+` + HEAD_END, 'iu'));
  if (plan) return {cls: '', label: '📋 ' + plan[0].replace(/[\s:*_.\-—–)\]]+$/, '').toUpperCase(), plan: true};
  const vote = firstHead(text).match(/^(VOTE|VOTO)\s*v?\d+\s*[*_]*\s*:\s*[*_]*\s*(yes|no|sì|si)(?![\p{L}\p{N}])/iu);
  if (vote) return {cls: /no/i.test(vote[2]) ? 'no' : 'yes', label: (/no/i.test(vote[2]) ? '✖ ' : '✔ ') + vote[0]};
  return null;
}
function nearBottom() { return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 140; }
function matches(m) { return !query || (m.text + ' ' + m.from).toLowerCase().includes(query); }

function pics(m) {
  const list = Array.isArray(m.images) ? m.images : [];
  if (!list.length) return '';
  return `<div class="pics${list.length > 1 ? ' many' : ''}">` +
    list.map(src => `<img loading="lazy" src="${esc(src)}" alt="#${m.n}">`).join('') + '</div>';
}
/** a reply (post --reply N) shows the line it answers; a click jumps to it */
function quoteOf(m) {
  const r = String(m.text).match(/^↪ #(\d+) /); if (!r) return '';
  const o = all.find(x => x.n === +r[1]);
  return `<div class="quote" onclick="document.getElementById('m${+r[1]}')?.scrollIntoView({behavior: 'smooth', block: 'center'})">↪ #${+r[1]} `
    + (o ? `<b>${esc(o.from)}</b>: ${esc(String(o.text).replace(/\s+/g, ' ').slice(0, 120))}` : '') + '</div>';
}
function card(m) {                          // a JSON status: the task, the bar, then each field that was given
  const p = profile(m.from), st = m.state, pct = Math.max(0, Math.min(100, +st.pct || 0));
  const row = (icon, html) => `<div class="f"><span>${icon}</span><span>${html}</span></div>`;
  const el = document.createElement('div');
  el.className = 'card'; el.style.setProperty('--who', p.color);
  el.innerHTML = `<div class="top">${esc(p.emoji)} <b style="color:${p.color}">${esc(m.from)}</b>` +
      (st.task ? `<span class="task">${esc(st.task)}</span>` : '') + `<span class="step">${inline(st.step || '')}</span><b>${pct}%</b></div>` +
    `<div class="bar"><i style="width:${pct}%"></i></div>` +
    (st.done ? row('✅', inline(st.done)) : '') +
    (st.evidence?.length ? row('🔎', `<ul>${st.evidence.map(x => `<li>${inline(x)}</li>`).join('')}</ul>`) : '') +
    (st.risks ? row('⚠️', inline(st.risks)) : '') + (st.blocked_by ? row('⛔', inline(st.blocked_by)) : '') +
    (st.needs ? row('🙋', inline(st.needs)) : '') + (st.next ? row('➡️', inline(st.next)) : '') +
    (st.free_min ? row('🤝', `~${+st.free_min} min`) : '') +
    (st.files?.length ? `<div class="chips">${st.files.map(f => `<code>${esc(f)}</code>`).join('')}</div>` : '') +
    `<div style="text-align:right"><span class="num">#${m.n} ${esc(m.time || '')}</span></div>` + pics(m);
  return el;
}
function build(m) {
  let el;
  if (isStatus(m) && m.state && typeof m.state === 'object') {
    el = card(m);
    if (!$('optStatus').checked) el.classList.add('hidden');
    lastFrom = null;
  } else if (m.kind === 'finding') {                     // a finding everyone should know (post --finding)
    const p = profile(m.from);
    el = document.createElement('div');
    el.className = 'pill finding';
    el.innerHTML = `${esc(p.emoji)} <b style="color:${p.color}">${esc(m.from)}</b> · ${inline(m.text)} <span class="num">#${m.n} ${esc(m.time || '')}</span>`;
    lastFrom = null;
  } else if (m.kind === 'choice') {                      // init --ask-mode: normal or research, chosen once (chat.py checks it)
    el = document.createElement('div');
    el.className = 'pill choice';
    el.innerHTML = `${inline(m.text)} <span class="num">#${m.n} ${esc(m.time || '')}</span><div class="choices"></div>`;
    const L = t(), open = config.mode === 'choose' && !m._room;
    for (const [key, icon, name, label] of [['normal', '💬', L.modeNormal, L.modeNormalTip], ['research', '🔬', 'Research', L.modeResearchTip]]) {
      const b = document.createElement('button');
      b.textContent = `${icon} ${name}`; b.title = label;
      b.disabled = !open; if (config.mode === key) b.classList.add('on');
      b.onclick = () => { el.querySelectorAll('button').forEach(x => x.disabled = true); b.classList.add('on'); runCommand({key}); };
      el.querySelector('.choices').append(b);
    }
    lastFrom = null;
  } else if (m.kind === 'board') {                       // a change of the task board (chat.py task)
    const p = profile(m.from);
    el = document.createElement('div');
    el.className = 'pill board';
    el.innerHTML = `${inline(m.text)} <span class="num">#${m.n} ${esc(m.time || '')}</span>`;
    el.title = m.from + (p.role ? ' · ' + p.role : '');
    lastFrom = null;
  } else if (isStatus(m) || isIdle(m)) {
    const p = profile(m.from), idle = isIdle(m);
    el = document.createElement('div');
    el.className = 'pill status' + (idle ? ' idle' : '');
    el.innerHTML = (idle ? '💤 ' : '') + `${esc(p.emoji)} <b style="color:${p.color}">${esc(m.from)}</b> · ` +
      (idle ? `<span class="tag">${esc(t().idle)}</span> · ` : '') +
      `${inline(m.text)} <span class="num">#${m.n} ${m.time}</span>` + pics(m);
    if (!$('optStatus').checked) el.classList.add('hidden');
    lastFrom = null;
  } else if (isClosed(m.text)) {
    el = document.createElement('div');
    el.className = 'pill closed';
    el.textContent = `✅ ${t().closed} · ${m.from}: ${m.text.split('\n')[0]} (${m.time})`;
    lastFrom = null;
  } else {
    const first = lastFrom !== m.from + (m._room || ''), p = profile(m.from, m._room ? roomCfg(m._room) || config : config), b = badge(m.text);
    el = document.createElement('div');
    el.className = 'row' + (USERS.has(m.from) ? ' out' : '') + (first ? ' first' : '');   // only the user's own lines sit on the right
    el.innerHTML = avatar(m.from) + `<div class="bubble${b && b.plan ? ' plan' : ''}">` +
      (first ? `<div class="who-line"><span class="name" style="color:${p.color}">${esc(m.from)}</span>` +
               (m._room ? `<span class="roomtag">🏢 ${esc(m._room)}</span>` : '') +
               (p.role ? `<span class="role">${esc(p.role)}</span>` : '') + `</div>` : '') +
      (b ? `<div class="badge ${b.cls}">${esc(b.label)}</div><br>` : '') +
      quoteOf(m) + `<div class="text">${render(m.text.replace(/^↪ #\d+ /, ''))}</div>` + pics(m) +
      `<div class="meta"><span class="num">#${m.n}</span>${m.time}</div></div>`;
    lastFrom = m.from + (m._room || '');
  }

  el.dataset.n = m.n;
  if (!matches(m)) el.classList.add('hidden');
  return el;
}
function add(m) {
  const stick = nearBottom();
  $('empty')?.remove();
  feed.appendChild(build(m));
  if (stick) feed.scrollTop = feed.scrollHeight;
  else { unseen++; $('newer').textContent = t().newer(unseen); $('newer').style.display = 'block'; }
}
// the common room's lines, when the user wants them in the main chat too: drawn here only, the agents never read them
let commonShown = [];
function buildCommon(m) {
  const el = document.createElement('div');
  el.className = 'pill common';
  el.innerHTML = `🛋 <b>${esc(m.from)}</b> · ${m.doc ? `<a href="common/doc/${+m.doc.id}" target="_blank" rel="noopener">📎 ${esc(m.doc.name)}</a>` : inline(m.text)} <span class="num">${esc(m.time || '')}</span>`;
  lastFrom = null;
  return el;
}
window.addEventListener('chatroom:common', e => {
  if (!config.common?.mirror) { if (commonShown.length) { commonShown = []; rerender(); } return; }
  for (const m of e.detail.messages || []) {
    if (commonShown.some(c => c.n === m.n && c.from === m.from)) continue;
    const c = {...m, _at: Date.now()}, stick = nearBottom();
    commonShown.push(c);
    $('empty')?.remove();
    feed.appendChild(buildCommon(c));
    if (stick) feed.scrollTop = feed.scrollHeight;
  }
});
function rerender() {
  const stick = nearBottom();
  feed.innerHTML = all.length || commonShown.length ? '' : `<div id="empty">${esc(t().empty)}</div>`;
  lastFrom = null;
  const mine = scope === 'other' ? [] : all, theirs = scope === 'self' ? [] : scope === 'all' ? nRooms.flatMap(r => r.all) : nAll;
  const items = [...mine.map(m => [stamp(m), m, false]), ...theirs.map(m => [stamp(m), m, false]), ...commonShown.map(c => [c._at, c, true])].sort((a, b) => a[0] - b[0]);
  for (const [, m, common] of items) feed.appendChild(common ? buildCommon(m) : build(m));
  if (stick) feed.scrollTop = feed.scrollHeight;
}

function stamp(m) {
  if (m.ts) return m.ts * 1000;
  const [h, mi, s] = m.time.split(':').map(Number), d = new Date(); d.setHours(h, mi, s, 0); return d.getTime();
}
function header() {
  const names = [...new Set([...(config.participants || []), ...all.map(m => m.from)])].filter(n => !(config.left || []).includes(n));
  const now = Date.now(), hb = config.heartbeat || 120;
  const idle = new Map(names.map(n => [n, idleOf(n)]).filter(([, m]) => m));
  setHTML($('strip'), names.map(n => {
    const mine = all.filter(m => m.from === n), last = mine[mine.length - 1];
    const age = last ? (now - stamp(last)) / 1000 : null, p = profile(n), sleeping = idle.get(n);
    const cls = SELF.has(n) || age === null ? '' : sleeping ? 'idle' : age <= hb ? 'on' : 'late';
    const title = (p.role ? p.role + ' · ' : '') + (sleeping ? t().idleSince(sleeping.time, sleeping.n)
      : age === null ? t().notYet : `${t().lastMsg} ${t().ago(age)}`);
    return `<span class="chip${sleeping ? ' idle' : ''}" title="${esc(title)}">${avatar(n)}<b style="color:${p.color}">${esc(n)}</b> ${mine.length}<span class="dot ${cls}"></span></span>`;
  }).join('') + `<span class="count">${esc(t().messages(all.length))}</span>`);
  // the "typing…" line: the freshest status of an agent still inside its timer and not idle
  const fresh = all.filter(m => isStatus(m) && !SELF.has(m.from) && !idle.has(m.from) && (now - stamp(m)) / 1000 <= hb);
  const live = $('live');
  if (fresh.length) {
    const m = fresh[fresh.length - 1], p = profile(m.from);
    live.className = 'live active';
    setHTML(live, `${esc(p.emoji)} <span class="who">${esc(m.from)}</span> ${esc(t().doing)} ${inline(m.text.split('\n')[0])}`);
  } else {
    live.className = 'live';
    setHTML(live, esc(config.subtitle || t().members(names.length)));
  }
}
// replace an element's HTML only when it changed: header() runs every few seconds, and rebuilding the line under
// the pointer between mousedown and mouseup would swallow a click on one of its links
function setHTML(el, html) { if (el._html !== html) { el.innerHTML = html; el._html = html; } }

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)(), o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 880; g.gain.value = .06; o.connect(g); g.connect(ctx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .18); o.stop(ctx.currentTime + .2);
  } catch (e) {}
}

function applyLook() {
  USERS = new Set([config.user_name || 'USER', ...(config.user_aliases || [])]);   // the user, under any name it used
  SELF = new Set([...USERS, ...(config.self_names || [])]);                       // the user and the lead: not participants
  const theme = config.theme === 'dark' || (config.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
  document.documentElement.style.setProperty('--accent', config.accent || '#00a884');
  document.documentElement.lang = config.lang || 'en';
  document.body.dataset.wall = config.wallpaper || 'dots';
  $('gicon').textContent = config.icon || '💬';
  $('title').textContent = config.title || config.topic || 'Chat room';
  document.title = config.title || config.topic || 'Chat room';
  const L = t();
  $('box').placeholder = L.placeholder(config.user_name || 'USER');
  $('hint').textContent = L.hint;
  $('cmdBtn').title = L.cmds; $('attach').title = L.attach;
  if (COMMANDS.length && COMMANDS._lang !== config.lang) loadCommands().then(() => { COMMANDS._lang = config.lang; });
  $('search').placeholder = L.search;
  $('searchBtn').title = L.search; $('soundBtn').title = L.sound; $('gear').title = L.settings;
  $('pTitle').textContent = L.settings; $('pSave').textContent = L.save; $('pCancel').textContent = L.cancel;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = L[el.dataset.t]);
  [...$('fTheme').options].forEach((o, i) => o.textContent = L.themes[i]);
  [...$('fWall').options].forEach((o, i) => o.textContent = L.walls[i]);
  const e = $('empty'); if (e) e.textContent = L.empty;
}
let configText = '';
async function loadConfig(force) {
  try {
    const r = await fetch((await FRIEND) + 'config.json?t=' + Date.now(), {cache: 'no-store'});
    if (r.ok) {
      // compare the server's text, not the merged object (its keys come in another order): a false change would
      // rebuild the whole feed every 5 s
      const text = await r.text();
      const changed = text !== configText;
      configText = text;
      config = Object.assign({}, config, JSON.parse(text));
      if (changed || force) { await I18N.load(config.lang); applyLook(); rerender(); window.dispatchEvent(new CustomEvent('chatroom:data', {detail: {all, config}})); }
    }
  } catch (e) {}

  for (let n = 1; n <= N; n += step) out.push(`<text x="${x(n)}" y="${H - 4}" text-anchor="middle">${n}</text>`);

  if (d.baseline) out.push(`<line x1="${L}" x2="${W - R}" y1="${y(d.baseline.metric)}" y2="${y(d.baseline.metric)}" stroke="${RS_COLOR.discard}" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W - R}" y="${y(d.baseline.metric) - 4}" text-anchor="end">${esc(I18N.text('viewer.research.lgBase'))}</text>`);
  if (path) out.push(`<path d="${path} H${W - R}" fill="none" stroke="${RS_COLOR.keep}" stroke-width="2.5" stroke-linejoin="round" opacity=".85"/>`);
  for (const a of runs) {
    const c = RS_COLOR[a.status] || RS_COLOR.discard, rev = a.state === 'revoked', cy = a.metric == null ? yCrash : y(a.metric), cx = x(a.n);
    const title = `att-${a.n} ${a.worker} ${rsNum(a.metric)} ${rsStatus(a.status)}${a.desc ? ': ' + a.desc : ''}`;
    out.push(`<g class="pt" data-n="${a.n}"><title>${esc(title)}</title><circle cx="${cx}" cy="${cy}" r="14" fill="transparent"/>` + (a.metric == null
      ? `<path d="M${cx - 5} ${cy - 5}L${cx + 5} ${cy + 5}M${cx + 5} ${cy - 5}L${cx - 5} ${cy + 5}" stroke="${c}" stroke-width="2.5" ${rev ? 'opacity=".5"' : ''}/>`
      : `<circle cx="${cx}" cy="${cy}" r="${a.n === bestAt ? 7 : 5.5}" fill="${rev ? 'none' : c}" stroke="${c}" stroke-width="2" ${rev ? 'stroke-dasharray="2 2" opacity=".6"' : ''}/>`) + (RS.sel === a.n ? `<circle cx="${cx}" cy="${cy}" r="11" fill="none" stroke="currentColor" stroke-width="1.5"/>` : '') + '</g>');
  }
  if (d.pending && d.pending.kind === 'attempt') out.push(`<circle class="rs-ring" cx="${x(d.pending.n)}" cy="${best !== null ? y(best) : (T + H - B) / 2}" r="9"/>`);
  return `<svg class="rs-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(I18N.text('viewer.research.results'))}">${out.join('')}</svg>`;
}
function rsDetail(d) {
  const a = d.attempts.find(x => x.n === RS.sel);
  if (!a) return esc(I18N.text('viewer.research.hint'));
  return esc(I18N.text('viewer.research.detail', {n: a.n, worker: a.worker, metric: rsNum(a.metric), status: rsStatus(a.status), secs: a.secs != null ? ' · ' + Math.round(a.secs) + ' s' : ''})) + (a.desc ? ` · ${esc(a.desc)}` : '')
    + (a.revoked_why ? ` · <b>${esc(I18N.text('viewer.research.lgRevoked'))}</b>: ${esc(a.revoked_why)}` : '');
}
function rsRuns(d) {
  const rows = d.attempts.slice().reverse(), shown = rows.slice(0, RS.shown), X = I18N;
  return `<div class="rs-tablewrap"><table class="rs-table"><tr><th>${esc(X.text('viewer.research.colN'))}</th><th>${esc(X.text('viewer.research.colWorker'))}</th><th>${esc(X.text('viewer.research.colMetric'))}</th><th>${esc(X.text('viewer.research.colStatus'))}</th><th>${esc(X.text('viewer.research.colTime'))}</th><th>${esc(X.text('viewer.research.colWhat'))}</th></tr>`
    + shown.map(a => `<tr class="${a.state === 'revoked' ? 'rev' : ''}" data-n="${a.n}" title="${esc(a.revoked_why || '')}"><td>att-${a.n}</td><td>${esc(a.worker)}</td><td>${esc(rsNum(a.metric))}</td><td>${rsChip(a.status, rsStatus(a.status))}</td><td>${a.secs != null ? Math.round(a.secs) + ' s' : '—'}</td><td>${esc(a.desc)}</td></tr>`).join('')
    + `</table></div>` + (rows.length > shown.length ? `<div class="rs-why">${esc(X.text('viewer.research.runsMore', {n: rows.length - shown.length}))}</div>` : '');
}
function rsWorkers(d) {
  const budget = d.contract.budget_s;
  return Object.entries(d.workers).map(([name, w]) => {
    const run = d.pending && d.pending.worker === name ? d.pending : null;
    return `<div class="rs-row"><b>${esc(name)}</b>` + (w.best ? `<small>${esc(I18N.text('viewer.research.wBest', {n: w.best.n, v: rsNum(w.best.metric)}))}</small>` : `<small>${esc(I18N.text('viewer.research.wNone'))}</small>`)
      + (w.paused ? rsChip('warn', I18N.text('viewer.research.wPaused')) : w.crashes ? rsChip('crash', I18N.text('viewer.research.wCrashes', {n: w.crashes})) : run ? '' : `<small>${esc(I18N.text('viewer.research.wIdle'))}</small>`) + '</div>'
      + (run ? `<div class="rs-row">${rsChip('run', I18N.text('viewer.research.wRunning', {n: run.n, desc: run.desc || ''}))}</div><div class="rs-bar"><i data-start="${run.child_ts || run.ts}" data-budget="${budget}" style="width:0"></i></div>` : '');
  }).join('') || `<div class="rs-why">${esc(I18N.text('viewer.research.wNone'))}</div>`;
}
function rsIdeas(d) {
  const runsOf = id => d.attempts.filter(a => a.idea === id && a.kind === 'attempt' && a.state !== 'revoked');
  const refuted = i => i.status === 'rejected' || (i.status === 'tried' && runsOf(i.id).length && runsOf(i.id).every(a => a.status !== 'keep'));
  const card = (i, trash) => `<div class="rs-idea ${trash ? 'trash' : esc(i.status)}"><b>${esc(i.id)}</b> ${esc(i.title)} <small>${esc(I18N.text('viewer.research.ideaBy', {by: i.by}))} · ${esc(I18N.text('viewer.research.idea.' + i.status))} · ${esc(I18N.text('viewer.research.ideaRuns', {n: runsOf(i.id).length}))}</small></div>`;
  const live = d.ideas.filter(i => !refuted(i)), bin = d.ideas.filter(refuted);
  return live.map(i => card(i, false)).join('') + (bin.length ? `<h3 style="margin-top:8px">${esc(I18N.text('viewer.research.ideaTrash'))}</h3>` + bin.map(i => card(i, true)).join('') : '');
}
function rsVerdicts(d) {
  return d.verdicts.map(v => `<div class="rs-row">${rsChip(v.outcome, I18N.text('viewer.research.out.' + v.outcome))}<b>${esc(I18N.text('viewer.research.vPhase', {n: v.phase}))}</b>`
    + (v.of ? `<small>${esc(I18N.text('viewer.research.vScore', {got: rsNum(v.score), of: v.of}))}</small>` : '') + `<small>${esc(v.by)}${v.notes ? ' · ' + esc(v.notes) : ''}</small></div>`).join('') || `<div class="rs-why">${esc(I18N.text('viewer.research.vNone'))}</div>`;
}
function rsRevoked(d) {
  const gone = new Set(d.attempts.filter(a => a.state === 'revoked').map(a => a.n));
  const kids = n => d.attempts.filter(a => gone.has(a.n) && a.parent_n === n).map(a => `<li>att-${a.n} ${esc(a.desc)}${sub(a.n)}</li>`).join('');
  const evid = n => d.evidence.filter(e => e.state === 'revoked' && e.source.includes('att-' + n)).map(e => `<li>${esc(e.id)} ${esc(e.text.slice(0, 80))}</li>`).join('');
  const sub = n => { const k = kids(n) + evid(n); return k ? `<ul>${k}</ul>` : ''; };
  const roots = d.attempts.filter(a => gone.has(a.n) && !gone.has(a.parent_n));
  return roots.length ? `<ul class="rs-chain">${roots.map(a => `<li><b>att-${a.n}</b> ${esc(a.desc)} <small>${esc(a.revoked_why)}</small>${sub(a.n)}</li>`).join('')}</ul>` : `<div class="rs-why">${esc(I18N.text('viewer.research.revNone'))}</div>`;
}
function rsProv(d) {
  const runs = d.attempts.filter(a => a.kind === 'attempt' && a.status !== 'crash'), sealed = runs.filter(a => a.built).length, last = d.attempts.slice().reverse().find(a => a.env && a.env.length);
  return `<div class="rs-seals">${runs.map(a => `<i class="${a.built ? 'on' : ''}" title="att-${a.n}: ${esc(a.built ? I18N.text('viewer.research.provSealed') : I18N.text('viewer.research.provPlain'))}"></i>`).join('')}</div>`
    + `<div class="rs-row"><small>${esc(I18N.text('viewer.research.provCount', {n: sealed, m: runs.length}))}</small></div>`
    + `<h3 style="margin-top:6px">${esc(I18N.text('viewer.research.envHead'))}</h3>` + (last ? `<div class="rs-chips">${last.env.flatMap(l => l.split(/\s+/)).map(x => `<code>${esc(x)}</code>`).join('')}</div>` : `<div class="rs-why">${esc(I18N.text('viewer.research.envNone'))}</div>`);
}
function rsContract(d) {
  const c = d.contract, files = c.sealed.join(', ');
  return `<div class="rs-row"><b>${esc(I18N.text('viewer.research.cProgram', {program: c.program}))}</b><small>${esc(I18N.text('viewer.research.cBudget', {s: c.budget_s, repeats: c.repeats}))}</small></div>`
    + (c.sealed.length ? `<div class="rs-row"><small>${esc(I18N.text('viewer.research.cSealed', {files}))}</small></div>` : '')
    + `<h3 style="margin-top:6px">${esc(I18N.text('viewer.research.amends'))}</h3>`
    + (d.amends.map(a => `<div class="rs-row"><small>${esc(I18N.text('viewer.research.amendLine', {n: a.after_run, by: a.by, what: a.what, reason: a.reason}))}</small></div>`).join('') || `<div class="rs-why">${esc(I18N.text('viewer.research.amendNone'))}</div>`);
}
function rsFinal(d) {
  if (d.final && d.final.metric != null) return `<div class="rs-row" style="font-size:15px">🏆 <b>${esc(I18N.text('viewer.research.finalLine', {search: rsNum(d.final.search_metric), final: rsNum(d.final.metric), delta: (d.final.metric - d.final.search_metric >= 0 ? '+' : '') + rsNum(d.final.metric - d.final.search_metric)}))}</b></div>`;
  return `<div class="rs-why">${esc(d.contract.final ? I18N.text('viewer.research.finalWait') : I18N.text('viewer.research.finalNone'))}</div>`;
}
function rsReport(d) {
  return d.report.exists ? d.report.sections.map(s => `<div class="rs-row">${s.ok ? '☑' : '☐'} ${esc(I18N.text('viewer.research.sec.' + (RS_SEC[s.name] || 'result')))}</div>`).join('')
    : `<div class="rs-why">${esc(I18N.text('viewer.research.reportNone'))}</div>`;
}
function rsLamps(d) {
  const g = d.lamps.gpu, k = d.lamps.lock, s = k ? Math.max(0, Math.round(Date.now() / 1000 - RS.skew - k.since)) : 0;
  return `<div class="rs-row"><span class="rs-lamp ${g ? 'warn' : ''}"></span>${esc(g ? I18N.text('viewer.research.gpuHeld', {by: g.by, reason: g.reason}) : I18N.text('viewer.research.gpuFree'))}</div>`
    + `<div class="rs-row"><span class="rs-lamp ${k && k.alive ? 'run' : ''}"></span>${esc(k && k.alive ? I18N.text('viewer.research.lockBusy', {who: k.who, s}) : I18N.text('viewer.research.lockFree'))}</div>`;
}
function rsLog(d) {
  return `<div class="rs-log">${d.log.slice(-12).reverse().map(l => `<div class="${l.ok ? '' : 'bad'}">${esc((l.ts || '').slice(11))} <b>${esc(l.by || '')}</b> ${esc(l.action || '')}${l.ok ? '' : ' ✕'} ${esc(l.detail || '')}</div>`).join('')}</div>`;
}
function rsRender() {
  const d = RS.data, box = $('research');
  if (!d) return;
  if (!d.enabled) return setHTML(box, `<div class="rs"><div id="empty" style="margin-top:40px">${esc(I18N.text('viewer.research.empty'))}</div></div>`);
  const c = d.contract, card = (title, body, wide) => `<section class="rs-card ${wide ? 'rs-wide' : ''}"><h3>${esc(title)}</h3>${body}</section>`, X = I18N;
  const head = `<div class="rs-head"><h2>🔬 ${esc(d.title || d.tag)}</h2><small>${esc(d.tag)}</small></div>`
    + `<section class="rs-card"><h3>${esc(X.text('viewer.research.phases'))}</h3>${rsPhases(d)}</section>`;
  const line = X.text('viewer.research.metricLine', {metric: c.metric, dir: c.direction === 'max' ? X.text('viewer.research.dirMax') : X.text('viewer.research.dirMin'), best: d.best ? rsNum(d.best.metric) : '—', base: d.baseline ? rsNum(d.baseline.metric) : '—', n: d.evals, max: c.max_evals});
  const results = `<div class="rs-row"><b>${esc(line)}</b>${c.min_gain ? `<small>${esc(X.text('viewer.research.minGain', {v: c.min_gain}))}</small>` : ''}</div>${rsChart(d)}`
    + `<div class="rs-legend"><span><i style="background:${RS_COLOR.keep}"></i>${esc(rsStatus('keep'))}</span><span><i style="background:${RS_COLOR.discard}"></i>${esc(rsStatus('discard'))}</span><span><i style="background:${RS_COLOR.crash}"></i>${esc(rsStatus('crash'))}</span><span><b style="background:${RS_COLOR.keep}"></b>${esc(X.text('viewer.research.lgBest'))}</span><span><b style="background:${RS_COLOR.warn};height:8px;vertical-align:0;border:1px solid #f57c00"></b>${esc(X.text('viewer.research.lgBand'))}</span></div><div class="rs-detail">${rsDetail(d)}</div>`;
  const html = `<div class="rs">${head}<div class="rs-grid">` + card(X.text('viewer.research.results'), results, true)
    + card(X.text('viewer.research.workers'), rsWorkers(d)) + card(X.text('viewer.research.lamps'), rsLamps(d))
    + card(X.text('viewer.research.ideas'), rsIdeas(d)) + card(X.text('viewer.research.verdicts'), rsVerdicts(d))
    + card(X.text('viewer.research.revs'), rsRevoked(d)) + card(X.text('viewer.research.prov'), rsProv(d))
    + card(X.text('viewer.research.contract'), rsContract(d)) + card(X.text('viewer.research.final'), rsFinal(d))
    + card(X.text('viewer.research.report'), rsReport(d)) + card(X.text('viewer.research.runs'), rsRuns(d), true)
    + card(X.text('viewer.research.log'), rsLog(d), true) + '</div></div>';
  const top = box.scrollTop; setHTML(box, html); box.scrollTop = top;

}
function rsBars() {                                                   // the budget bar of a run in progress (the page's clock, corrected by what the server's said)
  const now = Date.now() / 1000 - RS.skew;
  document.querySelectorAll('#research .rs-bar i').forEach(el => { el.style.width = Math.max(0, Math.min(100, (now - +el.dataset.start) / +el.dataset.budget * 100)) + '%'; });
}
async function rsLoad() {
  if (RS.busy || document.hidden) return; RS.busy = true;
  try {
    const r = await fetch('research.json', {cache: 'no-store'});
    if (r.ok) {
      const d = await r.json(), at = Date.now() / 1000;
      if (d.now) RS.skew = at - d.now;
      const key = JSON.stringify(d, (k, v) => k === 'now' ? undefined : v);       // `now` changes at every answer: not a change
      if (key !== RS.key) { RS.key = key; RS.data = d; rsRender(); }
    }
  } catch (e) { /* the viewer is away: the tab keeps what it had */ }
  RS.busy = false;
}
function rsOpen(on) {
  RS.open = !!on && config.mode === 'research'; setPref('research', RS.open);
  document.body.classList.toggle('rs-open', RS.open); $('researchBtn').classList.toggle('on', RS.open);
  if (RS.open) { RS.key = ''; rsLoad(); }
}
function rsSync() {                                                   // the button is there in research rooms only
  const on = config.mode === 'research';
  $('researchBtn').hidden = !on; $('researchBtn').title = I18N.text('viewer.research.tabTip');
  if (!on && RS.open) rsOpen(false);
  if (on && !RS.synced) { RS.synced = true; if (pref('research', false)) rsOpen(true); }
}
$('researchBtn').addEventListener('click', () => rsOpen(!RS.open));
$('research').addEventListener('click', e => {
  const el = e.target.closest('[data-n]'); if (el && RS.data) { RS.sel = +el.dataset.n; rsRender(); }
});
window.addEventListener('chatroom:data', rsSync);
addEventListener('resize', () => { if (RS.open && RS.data) rsRender(); });
setInterval(() => { if (RS.open) rsLoad(); }, 2500);
setInterval(() => { if (RS.open && RS.data) rsBars(); }, 1000);
/* the 3D office (office.js) reads the chat through these */
window.chatroom = {
  jumpTo, snapshot: () => ({all, config}),
  tag(name) { box.value = (box.value && !/\s$/.test(box.value) ? box.value + ' ' : box.value) + '@' + name + ' '; box.focus(); },
};
I18N_READY.then(() => loadConfig(true)).then(() => { poll(); setInterval(poll, 1500); setInterval(() => loadConfig(false), 5000); setInterval(header, 5000); });
</script>
<script type="module" src="office.js"></script>
