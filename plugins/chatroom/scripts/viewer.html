<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style id="d-tokens">
/* Chatroom 0.19 design tokens (DESIGN, D5). Single source for viewer.html, skills-view.js, preview-view.js.
   Paste this block as-is at the top of the view's own <style> (or reference the --d-* names: viewer.html will define them on :root).
   Rules: no hard-coded colors, radii or durations in views; no emoji as icons (inline SVG, stroke 1.8, round caps);
   every animation behind prefers-reduced-motion (see the last block). Reference implementation: scratch/DESIGN/mockup/index.html */
:root {
  --d-accent: var(--accent, #14b8a6);                                   /* room accent, user-chosen */
  --d-accent2: color-mix(in oklab, var(--d-accent) 45%, #6d5dfc);
  --d-grad: linear-gradient(135deg, var(--d-accent), var(--d-accent2));  /* primary buttons, progress, badges, own bubbles */
  --d-bg: #f4f1ec; --d-card: rgba(255,255,255,.78); --d-card2: rgba(255,255,255,.95); /* card2 = popovers/composer (opaque) */
  --d-line: rgba(24,24,48,.09); --d-hover: rgba(24,24,48,.05);
  --d-text: #16181f; --d-muted: #6b7080;
  --d-ok: #1f9d55; --d-no: #d6455d; --d-amber: #c98200; --d-amber-bg: rgba(245,180,0,.14);
  --d-shadow: 0 10px 30px -12px rgba(30,30,70,.28); --d-shadow-pop: 0 24px 60px -16px rgba(0,0,0,.5);
  /* radii */
  --d-r-sm: 10px; --d-r-md: 14px; --d-r-lg: 20px; --d-r-xl: 26px; --d-r-pill: 99px;
  /* motion: enter 450ms ease-out, hover/press 200ms, pop-ups 320ms spring */
  --d-ease: cubic-bezier(.2,.8,.2,1); --d-spring: cubic-bezier(.34,1.56,.64,1);
  --d-t-fast: .18s; --d-t: .3s; --d-t-enter: .45s;
  /* kind colors for cards and chips */
  --d-k-status: var(--d-accent); --d-k-plan: #8b6cff; --d-k-find: var(--d-amber); --d-k-skill: #e0489a; --d-k-cmd: #3b82f6; --d-k-vote: var(--d-ok);
  /* agent color from a hue 0-360: avatar and name use  oklch(.72 .15 H)  and a gradient to  oklch(.58 .17 H+40) */
}
:root[data-theme="dark"] {
  --d-bg: #090b11; --d-card: rgba(255,255,255,.055); --d-card2: rgba(26,30,44,.96);
  --d-line: rgba(255,255,255,.09); --d-hover: rgba(255,255,255,.06);
  --d-text: #eceef6; --d-muted: #8b91a6;
  --d-ok: #4cd27f; --d-no: #ff7088; --d-amber: #ffc84a; --d-amber-bg: rgba(255,200,74,.12);
  --d-shadow: 0 14px 34px -14px rgba(0,0,0,.7);
}
/* Existing convention kept: each view scopes its own prefix (--sv- spawn-view.js, --sk- skills-view.js, --pv- preview-view.js).
   A view maps its prefix onto these, e.g.  #skillsView { --sk-acc: var(--d-accent); --sk-card: var(--d-card); --sk-line: var(--d-line);
   --sk-text: var(--d-text); --sk-mute: var(--d-muted); --sk-good: var(--d-ok); --sk-bad: var(--d-no); --sk-ease: var(--d-ease); }
   so one change here restyles every view. viewer.html defines the --d-* on :root; spawn-view.js stays as it is (the reference). */
/* recipes (class names are only a suggestion):
   card      background var(--d-card); border 1px solid var(--d-line); border-radius var(--d-r-lg); backdrop-filter blur(14px); box-shadow var(--d-shadow)
             left stripe 4px in the kind color; hover: translateY(-2px) with var(--d-spring)
   chip      padding 5px 12px; radius var(--d-r-pill); on = border + 14% tint of its color
   tile      38px, radius 12px, linear-gradient(135deg, c1, c2), white SVG icon; selected: scale(1.08) rotate(-5deg)
   primary   background var(--d-grad); color #fff; radius pill; shadow 0 8px 18px -6px var(--d-accent); hover scale(1.06)
   enter     @keyframes enter { from { opacity:0; transform: translateY(14px) scale(.97) } }  var(--d-t-enter) var(--d-ease); stagger rows by 18ms (max 9)
   progress  7px bar, fill var(--d-grad), width grows 1.1s var(--d-ease), shimmer 2.2s */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
<style>
  /* Chatroom 0.19 (D5): the chat in the design language of scratch/DESIGN/mockup. Old variable names stay (research tab, office, cards.js read them),
     now defined from the --d-* tokens of the block above. */
  :root {
    --accent: #14b8a6;
    --bg: var(--d-bg); --text: var(--d-text); --muted: var(--d-muted); --in: var(--d-card); --out: var(--d-accent);
    --border: var(--d-line); --input: var(--d-hover); --panel: var(--d-card2); --header: transparent; --header-text: var(--d-text);
    --pill: var(--d-card); --pill-text: var(--d-muted); --link: var(--d-accent); --shadow: rgba(30,30,70,.18);
    --flash: color-mix(in oklab, var(--d-accent) 30%, transparent); --plan: var(--d-card); --plan-dark: var(--d-k-plan);
    --pattern: rgba(24,24,48,.07); --glow1: color-mix(in oklab, var(--d-accent) 22%, transparent); --glow2: rgba(109,93,252,.14);
    --gut: max(14px, calc((100vw - 980px) / 2 + 18px));
  }
  :root[data-theme="dark"] { --shadow: rgba(0,0,0,.5); --pattern: rgba(255,255,255,.06); --glow1: color-mix(in oklab, var(--d-accent) 20%, transparent); --glow2: rgba(109,93,252,.18); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html, body { overflow-x: clip; }   /* nothing parked off-screen (settings panel, toasts) may widen the page on a phone */
  body { font: 15px/1.5 "Inter", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--text);
         background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
  body::before { content: ""; position: fixed; inset: -20%; pointer-events: none; z-index: 0;
    background: radial-gradient(40% 35% at 12% 8%, var(--glow1), transparent 70%), radial-gradient(38% 34% at 92% 92%, var(--glow2), transparent 70%);
    animation: drift 24s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate3d(2%, -2%, 0) scale(1.06); } }
  body > header, body > .strip, body > .scope, body > #feed, body > #research, body > footer, body > .hr-warn { position: relative; z-index: 1; }
  button { font: inherit; color: inherit; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--d-accent); outline-offset: 2px; }

  /* header */
  header { color: var(--text); padding: 14px var(--gut) 10px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 2px; align-items: center; position: relative; z-index: 2; }
  .group-icon { width: 44px; height: 44px; border-radius: 15px; background: var(--d-grad); display: grid; place-items: center; font-size: 22px;
                flex: none; color: #fff; box-shadow: 0 8px 20px -6px var(--d-accent); margin-right: 10px; }
  .group-icon svg.i { width: 24px; height: 24px; }
  .head-text { min-width: 130px; flex: 1 1 130px; margin-right: 10px; }   /* with the words beside the icons the toolbar is wide: under 130 px the title leaves it a row of its own */
  .title { font-weight: 650; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 20px; }
  .live .who { font-weight: 650; }
  .live.active { color: var(--d-accent); }
  .live.active::before { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 7px 1px 0; border-radius: 50%; background: var(--d-accent); animation: bounce 1.1s infinite ease-in-out; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-3px); opacity: 1; } }
  .icon-btn { width: 40px; height: 40px; border-radius: 13px; border: 0; background: transparent; cursor: pointer; font-size: 17px; display: grid;
              place-items: center; color: var(--muted); flex: none; position: relative; transition: background var(--d-t-fast), color var(--d-t-fast), transform var(--d-t-fast) var(--d-spring); }
  .icon-btn:hover { background: var(--d-hover); color: var(--text); transform: translateY(-1px); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn.on { color: var(--d-accent); }
  #skillsBtn { color: var(--d-accent); }
  /* T17: every toolbar icon carries its word (0.19.9): beside the icon on a wide screen, under it on a phone */
  .icon-btn.has-lbl, #cmdBtn.has-lbl, #attach.has-lbl { width: auto; padding: 0 8px; display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .has-lbl .lbl { line-height: 1; }
  .icon-btn[hidden] { display: none; }   /* after has-lbl: the research button stays out of a normal room */
  .tools { display: contents; }   /* the toolbar: part of the header's own row on a wide screen; its own row that scrolls on a phone */
  #search { width: 0; padding: 0; opacity: 0; border: 0; border-radius: var(--d-r-md); background: var(--d-hover); color: var(--text); font: inherit; outline: none;
            transition: width var(--d-t) var(--d-ease), opacity var(--d-t-fast), padding var(--d-t); }
  #search.open { width: 220px; padding: 9px 14px; opacity: 1; }

  /* members strip */
  .strip { padding: 10px var(--gut) 8px; display: flex; gap: 8px; font-size: 13px; color: var(--muted); align-items: center; overflow-x: auto; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: var(--d-r-pill); background: var(--d-card); border: 1px solid var(--d-line);
          backdrop-filter: blur(14px); white-space: nowrap; flex: none; transition: transform var(--d-t) var(--d-spring), opacity var(--d-t); }
  .strip .chip:hover { transform: translateY(-2px); }
  .chip .av { width: 26px; height: 26px; font-size: 13px; box-shadow: none; }
  .chip b { font-weight: 600; font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .6; }
  .dot.on { background: var(--d-ok); opacity: 1; } .dot.late { background: var(--d-amber); opacity: 1; }
  .dot.idle { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
  .chip.idle { opacity: .7; }
  /* a role without tokens (0.13 spawn): a pager that blinks, light only, never a sound */
  .pager { cursor: pointer; animation: pager 1s steps(2, jump-none) infinite; filter: drop-shadow(0 0 3px #ff3b30); }
  @keyframes pager { 50% { opacity: .15; } }
  .strip .count { margin-left: auto; flex: none; padding-left: 10px; font-size: 12px; }

  /* feed */
  #feed { flex: 1; overflow-y: auto; padding: 8px var(--gut) 18px; scrollbar-width: thin; scrollbar-color: var(--d-line) transparent; }
  body[data-wall="dots"] #feed { background-image: radial-gradient(var(--pattern) 1.3px, transparent 1.3px); background-size: 18px 18px; }
  body[data-wall="grid"] #feed { background-image: linear-gradient(var(--pattern) 1px, transparent 1px), linear-gradient(90deg, var(--pattern) 1px, transparent 1px); background-size: 24px 24px; }
  .av.sm { width: 22px; height: 22px; font-size: 12px; box-shadow: none; display: inline-grid; vertical-align: middle; }
  .av { --c: #14b8a6; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; color: #fff; font-weight: 700; flex: none;
        background: linear-gradient(135deg, var(--c), color-mix(in oklab, var(--c) 62%, #20104a)); }
  .row { display: flex; gap: 10px; margin: 3px 0; align-items: flex-end; animation: enter var(--d-t-enter) var(--d-ease) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(14px) scale(.97); } }
  .row .av { visibility: hidden; }
  .row.first { margin-top: 14px; }
  .row.first .av { visibility: visible; align-self: flex-start; }
  .row.out { justify-content: flex-end; }
  .row.out .av { display: none; }
  .bubble { max-width: min(700px, 86%); background: var(--d-card); border: 1px solid var(--d-line); border-radius: 20px 20px 20px 8px; padding: 8px 14px 20px; backdrop-filter: blur(14px);
            position: relative; box-shadow: var(--d-shadow); overflow-wrap: anywhere; min-width: 120px; }
  .row.first:not(.out) .bubble { border-top-left-radius: 20px; }
  .row:not(.first):not(.out) .bubble { border-top-left-radius: 8px; }
  .row.out .bubble { background: var(--d-grad); color: #fff; border-color: transparent; border-radius: 20px 20px 8px 20px; box-shadow: 0 12px 26px -12px var(--d-accent); }
  .row.out .bubble .num, .row.out .bubble .meta, .row.out .bubble .rcpt { color: rgba(255,255,255,.78); }
  .row.out .bubble .who-line .name { color: #fff !important; }
  .row.out .bubble a.ref, .row.out .bubble a.mention { color: #fff !important; text-decoration: underline; }
  .row.out .bubble code { background: rgba(255,255,255,.2); }
  .bubble.plan { border-left: 4px solid var(--d-k-plan); }
  .who-line { display: flex; gap: 8px; align-items: baseline; margin-bottom: 2px; }
  .who-line .name { white-space: nowrap; flex: none; } .who-line .role { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name { font-weight: 650; font-size: 13px; }
  .role { color: var(--muted); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; }
  .rcpt { font-size: 11px; color: var(--muted); text-align: right; margin-top: 2px; padding-right: 70px; }
  .rcpt span { margin-left: 8px; white-space: nowrap; }
  .rcpt .read { color: #38bdf8; } .rcpt .replied { color: var(--d-ok); }
  .meta { position: absolute; right: 12px; bottom: 4px; font-size: 11px; color: var(--muted); }
  .num { color: var(--muted); font-size: 11px; margin-right: 6px; }
  .flash .bubble, .flash.pill, .flash.card { animation: flash 1.4s ease; }
  @keyframes flash { 30% { box-shadow: 0 0 0 4px var(--flash); } }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 10px 2px 8px; border-radius: var(--d-r-pill);
           margin: 0 0 6px; color: var(--d-k-plan); background: color-mix(in oklab, var(--d-k-plan) 16%, transparent); }
  .badge svg { width: 13px; height: 13px; }
  .badge.yes { color: var(--d-ok); background: color-mix(in oklab, var(--d-ok) 16%, transparent); } .badge.no { color: var(--d-no); background: color-mix(in oklab, var(--d-no) 16%, transparent); }
  .pill { margin: 7px auto; width: fit-content; max-width: 84%; background: var(--d-card); border: 1px solid var(--d-line); color: var(--muted); backdrop-filter: blur(14px);
          font-size: 13px; padding: 5px 14px; border-radius: var(--d-r-pill); text-align: center; animation: enter var(--d-t-enter) var(--d-ease) both; }
  .pill b { font-weight: 600; }
  .pill svg.i { width: 14px; height: 14px; vertical-align: -2px; margin-right: 3px; }
  .pill.common { border: 1px dashed var(--d-accent); background: transparent; }
  .scope { display: flex; gap: 6px; padding: 4px var(--gut) 6px; flex-wrap: wrap; }
  .esc-hint { font-size: 11.5px; font-weight: 600; color: var(--muted); border: 1px solid var(--d-line); border-radius: 7px; padding: 2px 7px; margin: 0 8px; white-space: nowrap; flex: none; }   /* the full-screen views: Esc goes back to the chat */
  .scope button { border: 1px solid var(--d-line); background: var(--d-card); color: inherit; border-radius: var(--d-r-pill); padding: 4px 13px; cursor: pointer; font-size: 12.5px;
                  transition: background var(--d-t-fast), color var(--d-t-fast), transform var(--d-t-fast) var(--d-spring); }
  .scope button:hover { transform: translateY(-1px); }
  .scope button.on { background: var(--d-grad); color: #fff; border-color: transparent; }
  .roomtag { font-size: 11px; opacity: .75; margin-left: 6px; }
  .pill.closed { background: var(--d-ok); border-color: transparent; color: #fff; font-weight: 650; font-size: 13.5px; padding: 8px 18px; box-shadow: 0 10px 24px -10px var(--d-ok); }
  .pill.idle { background: transparent; border: 1px dashed var(--d-line); }
  .pill.idle .tag { font-weight: 600; }
  .hidden { display: none !important; }
  /* Headroom missing (0.13): one line under the header, closed with its x */
  .hr-warn { display: flex; gap: 8px; align-items: center; margin: 0 var(--gut) 6px; padding: 2px 6px 2px 14px; background: var(--d-amber-bg); color: var(--d-amber); font-size: 13px;
             border-radius: var(--d-r-md); position: relative; z-index: 2; }
  .hr-warn[hidden] { display: none; } .hr-warn span { flex: 1; min-width: 0; } .hr-warn a { color: inherit; font-weight: 700; }
  .hr-warn button { width: 32px; height: 32px; border: 0; background: transparent; color: inherit; cursor: pointer; font-size: 15px; flex: none; }
  code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; background: var(--d-hover); padding: 1px 6px; border-radius: 6px; }
  mark { background: color-mix(in oklab, var(--d-amber) 45%, transparent); color: inherit; border-radius: 4px; }
  .mention { font-weight: 650; }
  a.mention { text-decoration: none; cursor: pointer; border-radius: 7px; padding: 0 4px; background: color-mix(in oklab, currentColor 13%, transparent); }
  span.mention { border-radius: 7px; padding: 0 4px; background: var(--d-hover); }
  a.ref { color: var(--d-accent); font-weight: 600; text-decoration: none; cursor: pointer; }
  a.ref:hover, a.mention:hover { text-decoration: underline; }
  table { border-collapse: collapse; margin: 5px 0; font-size: 12.5px; display: block; overflow-x: auto; }
  td, th { border: 1px solid var(--d-line); padding: 3px 8px; text-align: left; vertical-align: top; }
  th { font-weight: 600; background: var(--d-hover); }
  #newer { position: fixed; right: 26px; bottom: 120px; background: var(--d-grad); color: #fff; border: 0; border-radius: var(--d-r-pill); padding: 8px 16px; font-weight: 650;
           cursor: pointer; display: none; box-shadow: 0 12px 24px -8px var(--d-accent); z-index: 3; animation: enter var(--d-t) var(--d-spring) both; }
  #empty { text-align: center; color: var(--muted); margin-top: 60px; }
  .pics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .pics img { max-width: 100%; max-height: 320px; border-radius: 14px; display: block; cursor: zoom-in; background: var(--d-hover); transition: transform var(--d-t) var(--d-ease); }
  .pics img:hover { transform: scale(1.015); }
  .pics.many img { max-height: 200px; max-width: calc(50% - 3px); object-fit: cover; }
  .pill .pics { justify-content: center; } .pill .pics img { max-height: 160px; }
  /* a structured status (JSON): a card with the task, a progress bar and the fields that were given */
  .card { margin: 10px auto 10px 42px; width: min(540px, 92%); background: var(--d-card); border: 1px solid var(--d-line); backdrop-filter: blur(14px); color: var(--text); border-radius: var(--d-r-lg);
          padding: 10px 14px 8px 18px; box-shadow: var(--d-shadow); position: relative; overflow: hidden; font-size: 13.5px; animation: enter var(--d-t-enter) var(--d-ease) both; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--who, var(--d-accent)); }
  .card .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card .task { background: color-mix(in oklab, var(--d-k-status) 16%, transparent); color: var(--d-k-status); border-radius: var(--d-r-pill); padding: 1px 9px; font-weight: 700; font-size: 11.5px; letter-spacing: .04em; }
  .card .step { flex: 1; min-width: 40%; }
  .card .bar { height: 7px; border-radius: 7px; background: var(--d-hover); margin: 8px 0 6px; overflow: hidden; }
  .card .bar i { display: block; height: 100%; border-radius: 7px; background: var(--d-grad); position: relative; overflow: hidden; animation: grow 1.1s var(--d-ease) both; }
  .card .bar i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.5) 50%, transparent 70%); transform: translateX(-100%); animation: shimmer 2.2s 1s infinite; }
  @keyframes grow { from { width: 0; } } @keyframes shimmer { to { transform: translateX(100%); } }
  .card .f { display: grid; grid-template-columns: 22px 1fr; gap: 2px 4px; margin-top: 3px; }
  .card .f span:first-child { text-align: center; color: var(--muted); } .card .f svg.i { width: 15px; height: 15px; vertical-align: -3px; }
  .card .f.ok span:first-child { color: var(--d-ok); } .card .f.warn span:first-child { color: var(--d-amber); } .card .f.bad span:first-child { color: var(--d-no); }
  .card ul { margin: 0; padding-left: 16px; }
  .card .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .card .chips code { background: var(--d-hover); color: var(--muted); border-radius: 8px; padding: 1px 8px; font-size: 11.5px; }
  .pill.board { font-size: 12.5px; }
  .pill.finding { background: linear-gradient(90deg, var(--d-amber-bg), var(--d-card) 70%); color: var(--text); border-color: color-mix(in oklab, var(--d-amber) 40%, transparent); font-size: 13px; }
  .pill.finding svg.i { color: var(--d-amber); }
  .pill.choice { font-size: 13.5px; padding: 10px 16px; border-radius: var(--d-r-lg); }

<script>
// the texts are in locales/<lang>.json (viewer.*): the functions' fields in call order, and the one that holds logic
const VIEW_ARGS = {newer: ['n'], placeholder: ['u'], idleSince: ['time', 'n'], messages: ['n'], members: ['n'], previewTo: ['who']};
const VIEW_EXTRA = tx => ({ago: s => s < 60 ? tx('ago_s', {s: Math.round(s)}) : tx('ago_min', {m: Math.round(s / 60)})});
const PALETTE = ['#1fa855', '#027eb5', '#d9730d', '#8e44ad', '#c0392b', '#16a085', '#b7950b', '#6c5ce7', '#e84393', '#0984e3'];
const $ = id => document.getElementById(id);
const feed = $('feed');
// line icons (D5): one stroke style, no emoji in the chrome; the profile emoji of a participant stays its avatar
const IC_P = {"chat":"<path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/><path d=\"M8 10h8\"/>","flask":"<path d=\"M9 3h6M10 3v6.5L4.5 19a2 2 0 0 0 1.7 3h11.6a2 2 0 0 0 1.7-3L14 9.5V3\"/><path d=\"M7.5 15h9\"/>","cube":"<path d=\"M21 8l-9-5-9 5v8l9 5 9-5z\"/><path d=\"m3 8 9 5 9-5M12 13v8\"/>","search":"<circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"m21 21-4.3-4.3\"/>","bell":"<path d=\"M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9\"/><path d=\"M13.7 21a2 2 0 0 1-3.4 0\"/>","bellOff":"<path d=\"M13.7 21a2 2 0 0 1-3.4 0\"/><path d=\"M18.6 14.6C18 13.2 18 11 18 8a6 6 0 0 0-9.3-5M6.3 6.3A6 6 0 0 0 6 8c0 7-3 9-3 9h14\"/><path d=\"M2 2l20 20\"/>","sliders":"<path d=\"M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6\"/>","zap":"<polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/>","clip":"<path d=\"m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5\"/>","send":"<path d=\"M22 2 11 13M22 2l-7 20-4-9-9-4z\"/>","x":"<path d=\"M18 6 6 18M6 6l12 12\"/>","eye":"<path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/>","check":"<path d=\"M20 6 9 17l-5-5\"/>","moon":"<path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"/>","layers":"<path d=\"m12 2 10 5-10 5L2 7z\"/><path d=\"m2 17 10 5 10-5M2 12l10 5 10-5\"/>","vote":"<path d=\"M9 11l3 3L22 4\"/><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"/>","alert":"<path d=\"M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"/><path d=\"M12 9v4M12 17h.01\"/>","ban":"<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m4.9 4.9 14.2 14.2\"/>","hand":"<path d=\"M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8\"/><path d=\"M18 8a2 2 0 0 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-5.9-2.4L3.4 16a2 2 0 0 1 3.2-2.4L8 15\"/>","arrowRight":"<path d=\"M5 12h14M12 5l7 7-7 7\"/>","users":"<path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/>","home":"<path d=\"m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"/><path d=\"M9 22V12h6v10\"/>","building":"<rect x=\"4\" y=\"2\" width=\"16\" height=\"20\" rx=\"2\"/><path d=\"M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01\"/>","megaphone":"<path d=\"m3 11 18-5v12L3 14v-3z\"/><path d=\"M11.6 16.8a3 3 0 1 1-5.8-1.6\"/>","rocket":"<path d=\"M4.5 16.5c-1.5 1.3-2 5-2 5s3.7-.5 5-2c.7-.8.7-2.1-.1-2.9a2.2 2.2 0 0 0-2.9-.1z\"/><path d=\"m12 15-3-3a22 22 0 0 1 2-3.9A12.9 12.9 0 0 1 22 2c0 2.7-.8 7.5-6 11a22 22 0 0 1-4 2z\"/><path d=\"M9 12H4s.6-3 2-4c1.6-1.1 5 0 5 0M12 15v5s3-.6 4-2c1.1-1.6 0-5 0-5\"/>","flag":"<path d=\"M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z\"/><path d=\"M4 22v-7\"/>","pause":"<rect x=\"6\" y=\"4\" width=\"4\" height=\"16\" rx=\"1\"/><rect x=\"14\" y=\"4\" width=\"4\" height=\"16\" rx=\"1\"/>","shield":"<path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/><path d=\"m9 12 2 2 4-4\"/>","file":"<path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><path d=\"M14 2v6h6M16 13H8M16 17H8\"/>","buoy":"<circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"m4.9 4.9 4.2 4.2M14.8 14.8l4.3 4.3M14.8 9.2l4.3-4.3M4.9 19.1l4.2-4.2\"/>","slash":"<path d=\"M7 21 17 3\"/>"};
const ic = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC_P[n] || ''}</svg>`;
let config = {heartbeat: 120, user_name: 'USER', self_names: [], participants: [], profiles: {}, lang: 'en'};
// visiting a friend who shares the room chat: the chat shown and written here is the friend's room chat
const FRIEND = new URLSearchParams(location.search).has('visit')
  ? fetch('friendroom/config.json', {cache: 'no-store'}).then(r => r.ok ? 'friendroom/' : '').catch(() => '') : Promise.resolve('');
let SELF = new Set(['USER']), USERS = new Set(['USER']), shown = 0, lastFrom = null, all = [], unseen = 0, sound = false, query = '';
const t = () => I18N.table('viewer', VIEW_ARGS, VIEW_EXTRA, config.lang);

function pref(key, fallback) { try { const v = localStorage.getItem('chatroom.' + key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } }
function setPref(key, value) { try { localStorage.setItem('chatroom.' + key, JSON.stringify(value)); } catch (e) {} }

function profile(name, cfg = config) {
  const p = (cfg.profiles || {})[name] || {};
  const i = (config.participants || []).indexOf(name);
  let color = p.color;
  if (!color) {
    if (USERS.has(name)) color = '#c0392b';
    else if (SELF.has(name)) color = '#5c6bc0';                                      // the lead: its own colour, not the user's
    else if (i >= 0) color = PALETTE[i % PALETTE.length];
    else { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; color = PALETTE[h % PALETTE.length]; }
  }
  return {color, emoji: p.emoji || (USERS.has(name) ? '👤' : SELF.has(name) ? '👓' : name.slice(0, 1)),
          role: p.role || (SELF.has(name) && !USERS.has(name) ? 'LEAD' : '')};
}
function avatar(name, cls = '') {
  const p = profile(name);
  return `<div class="av ${cls}" style="--c:${p.color}" title="${esc(name)}">${esc(p.emoji)}</div>`;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
const EVERYONE = ['all', 'tutti', 'everyone'];
// the participant a tag points to, in any case (@nativo is NATIVO); null when nobody has that name
function canon(n) {
  const low = n.toLowerCase();
  const names = [...(config.participants || []), ...Object.keys(config.profiles || {}), ...all.map(m => m.from)];
  return names.find(x => x.toLowerCase() === low) || null;
}
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/(^|[^\w@])@([A-Za-z][\w-]*)/g, (m, pre, n) => {
    if (EVERYONE.includes(n.toLowerCase())) return `${pre}<span class="mention">@${n}</span>`;
    const who = canon(n);
    if (!who) return m;
    return `${pre}<a class="mention" data-who="${esc(who)}" style="color:${profile(who).color}">@${n}</a>`;
  });
  s = s.replace(/(^|[^\w&])#(\d{1,4})\b/g, (m, pre, n) => `${pre}<a class="ref" data-ref="${n}">#${n}</a>`);
  return s;
}
function render(text) {
  const lines = text.split('\n'), out = [];
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].trim().startsWith('|')) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith('|')) { rows.push(lines[i].trim()); i++; }
      i--;
      const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const body = rows.filter(r => !cells(r).every(c => /^:?-{2,}:?$/.test(c)));
      out.push('<table>' + body.map((r, k) => '<tr>' + cells(r).map(c => k === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</table>');
    } else {
      out.push(inline(lines[i]) + '<br>');
    }
  }
  return out.join('').replace(/(<br>)+$/, '');
}
const isStatus = m => m.kind === 'status' || m.kind === 'stato';
const isIdle = m => m.kind === 'idle';
// the idle status of a participant whose latest message is one (posting anything else ends the idle)
function idleOf(name) {
  for (let i = all.length - 1; i >= 0; i--) if (all[i].from === name) return isIdle(all[i]) ? all[i] : null;
  return null;
}
// the same reading as chat.py heads(): at the start of a line, after a reply mark, tags or markdown
const LINE_HEAD = /^(?:\s*↪\s*#\d+|\s*@[\w-]+[\s,:]*|\s*\d{1,3}[.)]\s+|[^\p{L}\p{N}_@↪]+|_+)+/u;
const QUOTED = /^\s*(?:↪\s*#\d+\s*)?(?:@[\w-]+[\s,:]*)*[>"“”«‘’'`(]/u;   // somebody else's words: not read
const heads = t => String(t || '').split('\n').filter(l => l.trim() && !QUOTED.test(l)).map(l => l.replace(LINE_HEAD, '')).filter(h => h.trim());
const firstHead = t => heads(t)[0] || '';
const HEAD_END = String.raw`[*_]*(?!\s*[\p{L}])`;   // a heading: "PLAN v2: ...", "PLAN v1 (draft)", not "PLAN v2 also needs a test"
const isClosed = text => new RegExp(String.raw`^(CLOSED|CHIUSO)(?:\s*[vV]\d+)?` + HEAD_END, 'u').test(firstHead(text));
function badge(text) {
  const plan = firstHead(text).match(new RegExp(String.raw`^(PLAN|PIANO)\s*v\d+` + HEAD_END, 'iu'));
  if (plan) return {cls: '', icon: 'vote', label: plan[0].replace(/[\s:*_.\-—–)\]]+$/, '').toUpperCase(), plan: true};
  const vote = firstHead(text).match(/^(VOTE|VOTO)\s*v?\d+\s*[*_]*\s*:\s*[*_]*\s*(yes|no|sì|si)(?![\p{L}\p{N}])/iu);
  if (vote) return {cls: /no/i.test(vote[2]) ? 'no' : 'yes', icon: /no/i.test(vote[2]) ? 'x' : 'check', label: vote[0]};
  return null;
}
function nearBottom() { return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 140; }
function matches(m) { return !query || (m.text + ' ' + m.from).toLowerCase().includes(query); }

function pics(m) {
  const list = Array.isArray(m.images) ? m.images : [];
  if (!list.length) return '';
  return `<div class="pics${list.length > 1 ? ' many' : ''}">` +
    list.map(src => `<img loading="lazy" src="${esc(src)}" alt="#${m.n}">`).join('') + '</div>';
}
/** a reply (post --reply N) shows the line it answers; a click jumps to it */
function quoteOf(m) {
  const r = String(m.text).match(/^↪ #(\d+) /); if (!r) return '';
  const o = all.find(x => x.n === +r[1]);
  return `<div class="quote" onclick="document.getElementById('m${+r[1]}')?.scrollIntoView({behavior: 'smooth', block: 'center'})">↪ #${+r[1]} `
    + (o ? `<b>${esc(o.from)}</b>: ${esc(String(o.text).replace(/\s+/g, ' ').slice(0, 120))}` : '') + '</div>';
}
function card(m) {                          // a JSON status: the task, the bar, then each field that was given
  const p = profile(m.from), st = m.state, pct = Math.max(0, Math.min(100, +st.pct || 0));
  const row = (icon, html, k = '') => `<div class="f${k ? ' ' + k : ''}"><span>${ic(icon)}</span><span>${html}</span></div>`;
  const el = document.createElement('div');
  el.className = 'card'; el.style.setProperty('--who', p.color);
  el.innerHTML = `<div class="top">${avatar(m.from, 'sm')} <b style="color:${p.color}">${esc(m.from)}</b>` +
      (st.task ? `<span class="task">${esc(st.task)}</span>` : '') + `<span class="step">${inline(st.step || '')}</span><b>${pct}%</b></div>` +
    `<div class="bar"><i style="width:${pct}%"></i></div>` +
    (st.done ? row('check', inline(st.done), 'ok') : '') +
    (st.evidence?.length ? row('search', `<ul>${st.evidence.map(x => `<li>${inline(x)}</li>`).join('')}</ul>`) : '') +
    (st.risks ? row('alert', inline(st.risks), 'warn') : '') + (st.blocked_by ? row('ban', inline(st.blocked_by), 'bad') : '') +
    (st.needs ? row('hand', inline(st.needs)) : '') + (st.next ? row('arrowRight', inline(st.next)) : '') +
    (st.runs_pct != null ? row('search', `runs ${+st.runs_pct}%`) : '') + (st.free_min ? row('users', `~${+st.free_min} min`) : '') +
    (st.files?.length ? `<div class="chips">${st.files.map(f => `<code>${esc(f)}</code>`).join('')}</div>` : '') +
    `<div style="text-align:right"><span class="num">#${m.n} ${esc(m.time || '')}</span></div>` + pics(m);
  return el;
}
function build(m) {
  let el;
  if (m.kind === 'card') {                               // a card (cards.py): drawn by cards.js, else its plain text
    el = window.CARDS?.build(m, !!m._room);
    if (!el) { el = document.createElement('div'); el.className = 'pill'; el.innerHTML = `${ic('layers')} ${inline(m.text)} <span class="num">#${m.n} ${esc(m.time || '')}</span>`; }
    lastFrom = null;
  } else if (isStatus(m) && m.state && typeof m.state === 'object') {
    el = card(m);
    if (!$('optStatus').checked) el.classList.add('hidden');
    lastFrom = null;
  } else if (m.kind === 'finding') {                     // a finding everyone should know (post --finding)
    const p = profile(m.from);
    el = document.createElement('div');
    el.className = 'pill finding';
    el.innerHTML = `${ic('zap')} <b style="color:${p.color}">${esc(m.from)}</b> · ${inline(m.text)} <span class="num">#${m.n} ${esc(m.time || '')}</span>`;
    lastFrom = null;
  } else if (m.kind === 'choice') {                      // init --ask-mode: normal or research, chosen once (chat.py checks it)
    el = document.createElement('div');
    el.className = 'pill choice';
    el.innerHTML = `${inline(m.text)} <span class="num">#${m.n} ${esc(m.time || '')}</span><div class="choices"></div>`;
    const L = t(), open = config.mode === 'choose' && !m._room;
    for (const [key, icon, name, label] of [['normal', ic('chat'), L.modeNormal, L.modeNormalTip], ['research', ic('flask'), 'Research', L.modeResearchTip]]) {
      const b = document.createElement('button');
      b.innerHTML = `${icon} ${esc(name)}`; b.title = label;
      b.disabled = !open; if (config.mode === key) b.classList.add('on');
      b.onclick = () => { el.querySelectorAll('button').forEach(x => x.disabled = true); b.classList.add('on'); runCommand({key}); };
      el.querySelector('.choices').append(b);

    + (v.of ? `<small>${esc(I18N.text('viewer.research.vScore', {got: rsNum(v.score), of: v.of}))}</small>` : '') + `<small>${esc(v.by)}${v.notes ? ' · ' + esc(v.notes) : ''}</small></div>`).join('') || `<div class="rs-why">${esc(I18N.text('viewer.research.vNone'))}</div>`;
}
function rsRevoked(d) {
  const gone = new Set(d.attempts.filter(a => a.state === 'revoked').map(a => a.n));
  const kids = n => d.attempts.filter(a => gone.has(a.n) && a.parent_n === n).map(a => `<li>att-${a.n} ${esc(a.desc)}${sub(a.n)}</li>`).join('');
  const evid = n => d.evidence.filter(e => e.state === 'revoked' && e.source.includes('att-' + n)).map(e => `<li>${esc(e.id)} ${esc(e.text.slice(0, 80))}</li>`).join('');
  const sub = n => { const k = kids(n) + evid(n); return k ? `<ul>${k}</ul>` : ''; };
  const roots = d.attempts.filter(a => gone.has(a.n) && !gone.has(a.parent_n));
  return roots.length ? `<ul class="rs-chain">${roots.map(a => `<li><b>att-${a.n}</b> ${esc(a.desc)} <small>${esc(a.revoked_why)}</small>${sub(a.n)}</li>`).join('')}</ul>` : `<div class="rs-why">${esc(I18N.text('viewer.research.revNone'))}</div>`;
}
function rsProv(d) {
  const runs = d.attempts.filter(a => a.kind === 'attempt' && a.status !== 'crash'), sealed = runs.filter(a => a.built).length, last = d.attempts.slice().reverse().find(a => a.env && a.env.length);
  return `<div class="rs-seals">${runs.map(a => `<i class="${a.built ? 'on' : ''}" title="att-${a.n}: ${esc(a.built ? I18N.text('viewer.research.provSealed') : I18N.text('viewer.research.provPlain'))}"></i>`).join('')}</div>`
    + `<div class="rs-row"><small>${esc(I18N.text('viewer.research.provCount', {n: sealed, m: runs.length}))}</small></div>`
    + `<h3 style="margin-top:6px">${esc(I18N.text('viewer.research.envHead'))}</h3>` + (last ? `<div class="rs-chips">${last.env.flatMap(l => l.split(/\s+/)).map(x => `<code>${esc(x)}</code>`).join('')}</div>` : `<div class="rs-why">${esc(I18N.text('viewer.research.envNone'))}</div>`);
}
function rsContract(d) {
  const c = d.contract, files = c.sealed.join(', ');
  return `<div class="rs-row"><b>${esc(I18N.text('viewer.research.cProgram', {program: c.program}))}</b><small>${esc(I18N.text('viewer.research.cBudget', {s: c.budget_s, repeats: c.repeats}))}</small></div>`
    + (c.sealed.length ? `<div class="rs-row"><small>${esc(I18N.text('viewer.research.cSealed', {files}))}</small></div>` : '')
    + `<h3 style="margin-top:6px">${esc(I18N.text('viewer.research.amends'))}</h3>`
    + (d.amends.map(a => `<div class="rs-row"><small>${esc(I18N.text('viewer.research.amendLine', {n: a.after_run, by: a.by, what: a.what, reason: a.reason}))}</small></div>`).join('') || `<div class="rs-why">${esc(I18N.text('viewer.research.amendNone'))}</div>`);
}
function rsFinal(d) {
  if (d.final && d.final.metric != null) return `<div class="rs-row" style="font-size:15px">🏆 <b>${esc(I18N.text('viewer.research.finalLine', {search: rsNum(d.final.search_metric), final: rsNum(d.final.metric), delta: (d.final.metric - d.final.search_metric >= 0 ? '+' : '') + rsNum(d.final.metric - d.final.search_metric)}))}</b></div>`;
  return `<div class="rs-why">${esc(d.contract.final ? I18N.text('viewer.research.finalWait') : I18N.text('viewer.research.finalNone'))}</div>`;
}
function rsReport(d) {
  return d.report.exists ? d.report.sections.map(s => `<div class="rs-row">${s.ok ? '☑' : '☐'} ${esc(I18N.text('viewer.research.sec.' + (RS_SEC[s.name] || 'result')))}</div>`).join('')
    : `<div class="rs-why">${esc(I18N.text('viewer.research.reportNone'))}</div>`;
}
function rsLamps(d) {
  const g = d.lamps.gpu, k = d.lamps.lock, s = k ? Math.max(0, Math.round(Date.now() / 1000 - RS.skew - k.since)) : 0;
  return `<div class="rs-row"><span class="rs-lamp ${g ? 'warn' : ''}"></span>${esc(g ? I18N.text('viewer.research.gpuHeld', {by: g.by, reason: g.reason}) : I18N.text('viewer.research.gpuFree'))}</div>`
    + `<div class="rs-row"><span class="rs-lamp ${k && k.alive ? 'run' : ''}"></span>${esc(k && k.alive ? I18N.text('viewer.research.lockBusy', {who: k.who, s}) : I18N.text('viewer.research.lockFree'))}</div>`;
}
function rsLog(d) {
  return `<div class="rs-log">${d.log.slice(-12).reverse().map(l => `<div class="${l.ok ? '' : 'bad'}">${esc((l.ts || '').slice(11))} <b>${esc(l.by || '')}</b> ${esc(l.action || '')}${l.ok ? '' : ' ✕'} ${esc(l.detail || '')}</div>`).join('')}</div>`;
}
function rsRender() {
  const d = RS.data, box = $('research');
  if (!d) return;
  if (!d.enabled) return setHTML(box, `<div class="rs"><div id="empty" style="margin-top:40px">${esc(I18N.text('viewer.research.empty'))}</div></div>`);
  const c = d.contract, card = (title, body, wide) => `<section class="rs-card ${wide ? 'rs-wide' : ''}"><h3>${esc(title)}</h3>${body}</section>`, X = I18N;
  const head = `<div class="rs-head"><h2>🔬 ${esc(d.title || d.tag)}</h2><small>${esc(d.tag)}</small></div>`
    + `<section class="rs-card"><h3>${esc(X.text('viewer.research.phases'))}</h3>${rsPhases(d)}</section>`;
  const line = X.text('viewer.research.metricLine', {metric: c.metric, dir: c.direction === 'max' ? X.text('viewer.research.dirMax') : X.text('viewer.research.dirMin'), best: d.best ? rsNum(d.best.metric) : '—', base: d.baseline ? rsNum(d.baseline.metric) : '—', n: d.evals, max: c.max_evals});
  const results = `<div class="rs-row"><b>${esc(line)}</b>${c.min_gain ? `<small>${esc(X.text('viewer.research.minGain', {v: c.min_gain}))}</small>` : ''}</div>${rsChart(d)}`
    + `<div class="rs-legend"><span><i style="background:${RS_COLOR.keep}"></i>${esc(rsStatus('keep'))}</span><span><i style="background:${RS_COLOR.discard}"></i>${esc(rsStatus('discard'))}</span><span><i style="background:${RS_COLOR.crash}"></i>${esc(rsStatus('crash'))}</span><span><b style="background:${RS_COLOR.keep}"></b>${esc(X.text('viewer.research.lgBest'))}</span><span><b style="background:${RS_COLOR.warn};height:8px;vertical-align:0;border:1px solid #f57c00"></b>${esc(X.text('viewer.research.lgBand'))}</span></div><div class="rs-detail">${rsDetail(d)}</div>`;
  const html = `<div class="rs">${head}<div class="rs-grid">` + card(X.text('viewer.research.results'), results, true)
    + card(X.text('viewer.research.workers'), rsWorkers(d)) + card(X.text('viewer.research.lamps'), rsLamps(d))
    + card(X.text('viewer.research.ideas'), rsIdeas(d)) + card(X.text('viewer.research.verdicts'), rsVerdicts(d))
    + card(X.text('viewer.research.revs'), rsRevoked(d)) + card(X.text('viewer.research.prov'), rsProv(d))
    + card(X.text('viewer.research.contract'), rsContract(d)) + card(X.text('viewer.research.final'), rsFinal(d))
    + card(X.text('viewer.research.report'), rsReport(d)) + card(X.text('viewer.research.runs'), rsRuns(d), true)
    + card(X.text('viewer.research.log'), rsLog(d), true) + '</div></div>';
  const top = box.scrollTop; setHTML(box, html); box.scrollTop = top;
  rsBars();
}
function rsBars() {                                                   // the budget bar of a run in progress (the page's clock, corrected by what the server's said)
  const now = Date.now() / 1000 - RS.skew;
  document.querySelectorAll('#research .rs-bar i').forEach(el => { el.style.width = Math.max(0, Math.min(100, (now - +el.dataset.start) / +el.dataset.budget * 100)) + '%'; });
}
async function rsLoad() {
  if (RS.busy || document.hidden) return; RS.busy = true;
  try {
    const r = await fetch('research.json', {cache: 'no-store'});
    if (r.ok) {
      const d = await r.json(), at = Date.now() / 1000;
      if (d.now) RS.skew = at - d.now;
      const key = JSON.stringify(d, (k, v) => k === 'now' ? undefined : v);       // `now` changes at every answer: not a change
      if (key !== RS.key) { RS.key = key; RS.data = d; rsRender(); }
    }
  } catch (e) { /* the viewer is away: the tab keeps what it had */ }
  RS.busy = false;
}
function rsOpen(on) {
  RS.open = !!on && config.mode === 'research'; setPref('research', RS.open);
  document.body.classList.toggle('rs-open', RS.open); $('researchBtn').classList.toggle('on', RS.open);
  if (RS.open) { RS.key = ''; rsLoad(); }
}
function rsSync() {                                                   // the button is there in research rooms only
  const on = config.mode === 'research';
  $('researchBtn').hidden = !on; $('researchBtn').title = I18N.text('viewer.research.tabTip');
  if (!on && RS.open) rsOpen(false);
  if (on && !RS.synced) { RS.synced = true; if (pref('research', false)) rsOpen(true); }
}
$('researchBtn').addEventListener('click', () => rsOpen(!RS.open));
$('research').addEventListener('click', e => {
  const el = e.target.closest('[data-n]'); if (el && RS.data) { RS.sel = +el.dataset.n; rsRender(); }
});
window.addEventListener('chatroom:data', rsSync);
addEventListener('resize', () => { if (RS.open && RS.data) rsRender(); });
setInterval(() => { if (RS.open) rsLoad(); }, 2500);
setInterval(() => { if (RS.open && RS.data) rsBars(); }, 1000);
/* Headroom missing (0.13): a warning closed with ✕ for this viewer session (it comes back in the next one while Headroom is missing),
   and a link that installs it after a confirm. Hidden when the server says nothing (an older one) */
async function headroomCheck() {
  try {
    const s = await (await fetch('settings.json', {cache: 'no-store'})).json(), st = s.headroom_install || {}, L = t();
    let closed = false; try { closed = sessionStorage.getItem('chatroom.hrClosed') === '1'; } catch (e) {}
    $('hrWarn').hidden = closed || (s.headroom !== false && !st.busy && !st.error);
    $('hrText').textContent = st.busy ? L.hrBusy : st.error ? L.hrFail + ' ' + st.error : L.hrMissing;
    $('hrHere').hidden = !!st.busy;
    if (st.busy) setTimeout(headroomCheck, 3000);
  } catch (e) {}
}
$('hrX').addEventListener('click', () => { try { sessionStorage.setItem('chatroom.hrClosed', '1'); } catch (e) {} $('hrWarn').hidden = true; });
$('hrHere').addEventListener('click', async e => {
  e.preventDefault();
  if (!confirm(t().hrConfirm)) return;
  try { await fetch('headroom_install', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'}); } catch (err) {}
  headroomCheck();
});
/* the 3D office (office.js) reads the chat through these */
window.chatroom = {
  jumpTo, snapshot: () => ({all, config}),
  tag(name) { box.value = (box.value && !/\s$/.test(box.value) ? box.value + ' ' : box.value) + '@' + name + ' '; box.focus(); },
};
I18N_READY.then(() => loadConfig(true)).then(() => { headroomCheck(); poll(); setInterval(poll, 1500); pollReceipts(); setInterval(pollReceipts, 3000); setInterval(() => loadConfig(false), 5000); setInterval(header, 5000); pollRoles(); setInterval(pollRoles, 5000); });
</script>

<script>
/* the chat column beside the office: narrow when it is under 700 px, whatever the window (the office takes 62% of it) */
(function () {
  const NARROW = 700;
  function check() {
    const cs = getComputedStyle(document.body);
    const w = document.body.clientWidth - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0);
    document.body.classList.toggle('chat-narrow', w > 0 && w < NARROW && window.innerWidth > 640);
  }
  addEventListener('resize', check);
  if (window.ResizeObserver) new ResizeObserver(check).observe(document.body);
  new MutationObserver(check).observe(document.body, { attributes: true, attributeFilter: ['class', 'style'] });
  check();
})();
</script>
